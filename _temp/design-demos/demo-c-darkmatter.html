<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>C · 暗物质实验室</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0f;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bg-grid{position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.neon-lines{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding-left:15%;gap:3px;opacity:.3}
.neon-lines span{height:2px;border-radius:1px;filter:blur(1px)}
.neon-lines span:nth-child(1){width:200px;background:#FF6B35;box-shadow:0 0 8px #FF6B35}
.neon-lines span:nth-child(2){width:140px;background:#00D4AA;box-shadow:0 0 6px #00D4AA}
.neon-lines span:nth-child(3){width:180px;background:#7B2D8E;box-shadow:0 0 6px #7B2D8E}
.neon-lines span:nth-child(4){width:100px;background:#3B5BA5;box-shadow:0 0 6px #3B5BA5}
.card-wrap{position:relative;z-index:1;width:100%;max-width:380px;margin:24px}
.card{background:rgba(20,20,30,.6);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.04);border-radius:2px;padding:40px 36px}
.brand{margin-bottom:28px}
.brand h1{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:#fff;letter-spacing:3px}
.brand .sub{font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1.5px;margin-top:4px;font-family:'JetBrains Mono',monospace}
.field{margin-bottom:20px}
.field label{display:block;font-size:10px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.field input,.field select{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.06);padding:10px 0;font-size:15px;font-family:'Inter',sans-serif;color:#fff;outline:none;transition:border-color .3s}
.field input::placeholder{color:rgba(255,255,255,.08)}
.field input:focus,.field select:focus{border-bottom-color:#FF6B35}
.field select{color:#fff;background:transparent;-webkit-appearance:none}
.field select option{background:#1a1a2e;color:#fff}
.btn{width:100%;padding:13px 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px;font-family:'JetBrains Mono',monospace;cursor:pointer;letter-spacing:2px;transition:.3s}
.btn:hover{background:rgba(255,107,53,.1);border-color:#FF6B35;box-shadow:0 0 20px rgba(255,107,53,.1)}
.spectral-dots{display:flex;gap:8px;margin-top:24px;justify-content:center}
.spectral-dots span{width:4px;height:4px;border-radius:50%}
.spectral-dots span:nth-child(1){background:#FF6B35;box-shadow:0 0 6px #FF6B35}
.spectral-dots span:nth-child(2){background:#00D4AA;box-shadow:0 0 6px #00D4AA}
.spectral-dots span:nth-child(3){background:#7B2D8E;box-shadow:0 0 6px #7B2D8E}
.spectral-dots span:nth-child(4){background:#3B5BA5;box-shadow:0 0 6px #3B5BA5}
</style></head><body>
<div class="bg-grid"></div>
<div class="neon-lines"><span></span><span></span><span></span><span></span></div>
<div class="card-wrap">
<div class="card">
<div class="brand"><h1>智辅化学</h1><p class="sub">CHEMAI · SPECTROSCOPY LAB</p></div>
<div class="field"><label>Username</label><input type="text" placeholder="hai"></div>
<div class="field"><label>Password</label><input type="password" placeholder="········"></div>
<div class="field"><label>Role</label><select><option>Teacher</option><option>Student</option><option>Parent</option></select></div>
<button class="btn">ENTER LAB</button>
<div class="spectral-dots"><span></span><span></span><span></span><span></span></div>
</div>
</div>
<p style="position:fixed;bottom:24px;font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,.1);text-align:center;width:100%">C · Dark Matter Lab &nbsp;|&nbsp; Olafur Eliasson × Night Spectroscopy</p>
</body></html>
