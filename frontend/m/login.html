<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>智辅化学 · 学生登录</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#f7f4ed;color:#1a1a1a;
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:20px;
}
.card{
  width:100%;max-width:360px;background:#fff;
  border-radius:16px;padding:36px 28px 28px;
  box-shadow:0 4px 20px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#b43c28,#8b2918);
}
.brand{
  font-family:'Cormorant Garamond','Noto Serif SC',serif;
  font-size:28px;font-weight:700;text-align:center;margin-bottom:4px;
  background:linear-gradient(135deg,#b43c28,#8b2918);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.subtitle{text-align:center;font-size:13px;color:#888;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:#888;margin-bottom:4px;font-weight:500}
.field input{
  width:100%;padding:12px 14px;border:1.5px solid #e8e4db;
  border-radius:10px;font-size:15px;outline:none;background:#faf8f3;transition:.15s;
}
.field input:focus{border-color:#b43c28;background:#fff}
.btn{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:#b43c28;color:#fff;font-size:15px;font-weight:500;
  cursor:pointer;margin-top:8px;transition:.15s;
}
.btn:active{transform:scale(.98);opacity:.9}
.btn:disabled{opacity:.5;pointer-events:none}
.msg{text-align:center;font-size:13px;margin-top:12px;min-height:20px}
.msg.error{color:#b43c28}.msg.success{color:#2c6e49}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#bbb}
.footer a{color:#b43c28;text-decoration:none}
</style>
</head><body>

<div class="card">
  <div class="brand">智辅化学</div>
  <div class="subtitle">学生登录</div>

  <div class="field">
    <label>学号</label>
    <input id="username" placeholder="输入学号" autocomplete="username">
  </div>

  <div class="field">
    <label>密码</label>
    <input id="password" type="password" placeholder="输入密码" autocomplete="current-password">
  </div>

  <button class="btn" id="btn" onclick="login()">登录</button>
  <div class="msg" id="msg"></div>

  <div class="footer">
    <a href="/login.html">教师登录</a>
  </div>
</div>

<script>
var msg=document.getElementById('msg'),btn=document.getElementById('btn')

function login(){
  var u=document.getElementById('username').value.trim()
  var p=document.getElementById('password').value.trim()
  if(!u||!p){msg.className='msg error';msg.textContent='请输入学号和密码';return}
  btn.disabled=true;btn.textContent='登录中...';msg.textContent=''

  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:u,password:p})})
  .then(function(r){return r.json()})
  .then(function(data){
    if(data.success){
      msg.className='msg success';msg.textContent='登录成功'
      var ud={id:data.user.id,username:data.user.username,name:data.user.name,
        role:data.user.role,school:data.user.school,token:data.token,refreshToken:data.refresh_token}
      sessionStorage.setItem('chemai_user',JSON.stringify(ud))
      localStorage.setItem('token',data.token)
      // Always go to student mobile page
      setTimeout(function(){location.href='/m/index.html'},400)
    }else{
      msg.className='msg error';msg.textContent=data.message||'学号或密码错误'
      btn.disabled=false;btn.textContent='登录'
    }
  }).catch(function(e){
    msg.className='msg error';msg.textContent='网络错误，请重试'
    btn.disabled=false;btn.textContent='登录'
  })
}

document.getElementById('password').addEventListener('keydown',function(e){
  if(e.key==='Enter')login()
})
</script>
</body></html>
