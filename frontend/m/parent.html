<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ChemAI · 家长端</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════
   ChemAI 家长端 — 信息面板型 Dashboard
   视觉: 暖灰墨绿稳重风 · 大字版 16px · 一屏看完核心信息
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --bg:        #f5f0e8;
  --card:      #fdfbf7;
  --ink:       #2c2c2c;
  --ink-soft:  #5e5e5e;
  --ink-light: #8a8a8a;
  --accent:    #2d5a4b;
  --accent-soft:#e8f0ec;
  --accent-gold:#b8935a;
  --divider:   rgba(0,0,0,.06);
  --green:     #3d8b5e;
  --amber:     #c4883c;
  --radius:    14px;
  --shadow:    0 1px 4px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink);
  max-width:450px;margin:0 auto;min-height:100dvh;
  font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
/* Header */
.header{padding:20px 16px 14px;display:flex;align-items:center;justify-content:space-between}
.header .left{display:flex;align-items:center;gap:10px}
.header .avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#c4d8ce,#8aada0);display:flex;align-items:center;justify-content:center;color:#fff}
.header .avatar .material-icons{font-size:22px}
.header .label{font-size:14px;color:var(--ink-light)}
.header .name{font-size:18px;font-weight:600;color:var(--ink);line-height:1.3}
.header .right{display:flex;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);color:var(--ink-soft);transition:.15s}
.icon-btn:active{background:var(--accent-soft)}
.icon-btn .material-icons{font-size:20px}
/* Child bar */
.child-bar{margin:0 16px;padding:10px 14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.child-bar .child-icon{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex-shrink:0}
.child-bar .info{flex:1;min-width:0}
.child-bar .c-name{font-size:16px;font-weight:600}
.child-bar .c-class{font-size:13px;color:var(--ink-light)}
/* Content */
.content{padding:14px 16px 100px;display:flex;flex-direction:column;gap:14px}
/* Tabs */
.tabs{display:flex;gap:4px;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;border-radius:20px;border:1px solid transparent;font-size:14px;cursor:pointer;color:var(--ink-soft);white-space:nowrap;transition:.15s}
.tab.active{background:var(--card);color:var(--accent);font-weight:600;border-color:var(--accent);box-shadow:var(--shadow)}
.tab:active:not(.active){background:var(--card)}
/* Panes */
.pane{display:none}
.pane.active{display:block}
/* Summary row */
.summary-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.stat-card .stat-label{font-size:13px;color:var(--ink-light)}
.stat-card .stat-value{font-size:28px;font-weight:700;color:var(--accent);letter-spacing:-.5px}
.stat-card .stat-unit{font-size:14px;font-weight:400;color:var(--ink-soft)}
.stat-card .stat-sub{font-size:13px;color:var(--green);margin-top:2px;display:flex;align-items:center;gap:3px}
.stat-card .stat-sub .material-icons{font-size:14px}
/* Report card */
.report-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.report-card .card-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.report-card .card-title .material-icons{color:var(--accent);font-size:22px}
/* Barrier */
.barrier-section{margin-bottom:14px}
.barrier-item{margin-bottom:8px}
.barrier-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.bar-name{font-size:15px;font-weight:500}
.bar-pct{font-size:14px;color:var(--ink-soft)}
.bar-track{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bar-fill.concept{background:#c9a87c}
.bar-fill.reading{background:#7ea8b4}
.bar-fill.expression{background:#9dab86}
.diagnosis-text{background:var(--accent-soft);border-radius:10px;padding:14px;font-size:15px;line-height:1.7;color:var(--ink);margin-top:12px}
.diagnosis-text .highlight{color:var(--accent);font-weight:600}
/* Weekly */
.weekly-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider)}
.weekly-item:last-child{border-bottom:none}
.w-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.w-icon .material-icons{font-size:18px}
.w-icon.knowledge{background:#e8f0ec;color:var(--accent)}
.w-icon.improve{background:#f0ece4;color:var(--accent-gold)}
.w-icon.suggest{background:#f0e8e4;color:var(--amber)}
.weekly-item .w-text{flex:1;min-width:0}
.w-label{font-size:14px;font-weight:500;margin-bottom:2px}
.w-detail{font-size:14px;color:var(--ink-soft);line-height:1.5}
/* Notifications */
.notif-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider);align-items:flex-start}
.notif-item:last-child{border-bottom:none}
.n-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--accent)}
.notif-item.read .n-dot{background:transparent}
.n-content{flex:1;min-width:0}
.n-title{font-size:15px;font-weight:500}
.n-time{font-size:12px;color:var(--ink-light);margin-top:2px}
/* Empty */
.empty-state{text-align:center;padding:40px 20px}
.empty-state .material-icons{font-size:56px;color:#d0ccc2;margin-bottom:12px}
.empty-state h3{font-size:17px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.empty-state p{font-size:14px;color:var(--ink-light);line-height:1.6}
/* Ask AI */
.ask-ai{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:418px;padding:16px 20px;background:var(--accent);color:#fff;border:none;border-radius:16px;font-size:17px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 16px rgba(45,90,75,.3);transition:transform .15s;z-index:10}
.ask-ai:active{transform:translateX(-50%) scale(.97)}
.ask-ai .material-icons{font-size:22px}
/* Loading */
.loading{text-align:center;padding:24px;color:var(--ink-light)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--bg);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Chat overlay */
.chat-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
.chat-overlay.open{display:flex}
.chat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--divider)}
.back-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.chat-head .title{font-size:17px;font-weight:600}
.chat-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.chat-input-bar{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--divider);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.chat-input-bar input{flex:1;padding:12px 16px;border:1.5px solid #e0dcd4;border-radius:24px;font-size:16px;outline:none;background:var(--bg)}
.chat-input-bar input:focus{border-color:var(--accent)}
.chat-input-bar button{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(45,90,75,.25)}
.chat-input-bar button:active{transform:scale(.9)}
.quick-prompts{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 10px}
.quick-prompt{padding:9px 14px;border-radius:20px;border:1px solid #d5d0c6;background:var(--card);font-size:14px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;transition:.15s}
.quick-prompt:active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* Chat msg bubbles */
.msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.6;word-break:break-word;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-user{align-self:flex-end;margin-left:auto;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg-ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.msg-ai strong{color:var(--accent)}
.msg-system{align-self:center;font-size:12px;color:var(--ink-light);padding:2px 0}
.thinking{align-self:flex-start;background:var(--card);padding:10px 16px;border-radius:18px;border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);font-size:14px;color:var(--ink-light);display:flex;align-items:center;gap:6px}
.tool-card{background:#faf8f3;border:1px solid rgba(45,90,75,.08);border-radius:10px;padding:8px 10px;font-size:13px;margin:2px 0}
.tool-card .head{color:var(--accent);font-weight:600;margin-bottom:2px;font-size:12px}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:200;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:18px;padding:24px 20px;width:calc(100% - 48px);max-width:390px;box-shadow:0 8px 32px rgba(0,0,0,.1)}
.modal h3{font-size:18px;font-weight:600;margin-bottom:16px}
.modal label{font-size:14px;color:var(--ink-soft);display:block;margin-bottom:4px}
.modal input{width:100%;padding:12px 14px;border:1.5px solid #e0dcd4;border-radius:10px;font-size:16px;outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--accent)}
.modal .btn-row{display:flex;gap:10px;margin-top:16px}
.modal .btn{flex:1;padding:12px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer}
.btn-cancel{background:var(--bg);color:var(--ink-soft)}
.btn-confirm{background:var(--accent);color:#fff}
.btn-confirm:active{opacity:.85}
</style>
</head>
<body>

<!-- ═══ Header ═══ -->
<div class="header">
  <div class="left">
    <div class="avatar"><span class="material-icons">person</span></div>
    <div>
      <div class="label" id="greeting">下午好</div>
      <div class="name" id="parentName">家长</div>
    </div>
  </div>
  <div class="right">
    <button class="icon-btn" id="bindBtn" onclick="handleBindClick()"><span class="material-icons" id="bindIcon">add_link</span></button>
    <button class="icon-btn" onclick="doLogout()"><span class="material-icons">logout</span></button>
  </div>
</div>

<!-- ═══ Child bar ═══ -->
<div class="child-bar" id="childBar" style="display:none">
  <div class="child-icon" id="childInitial">-</div>
  <div class="info">
    <div class="c-name" id="childName">未绑定</div>
    <div class="c-class" id="childClass">请先绑定孩子</div>
  </div>
</div>

<!-- ═══ Tabs ═══ -->
<div class="tabs" id="tabBar" style="display:none">
  <span class="tab active" onclick="switchTab('home')">概览</span>
  <span class="tab" onclick="switchTab('report')">学习报告</span>
  <span class="tab" onclick="switchTab('notif')">消息</span>
</div>

<!-- ═══ Content ═══ -->
<div class="content" id="content">

  <!-- Empty: no child bound -->
  <div id="pane-empty" class="pane active">
    <div class="empty-state">
      <span class="material-icons">family_restroom</span>
      <h3>还没有绑定孩子</h3>
      <p>绑定后可以查看孩子的<br>学习报告和成长动态</p>
      <button class="btn-confirm" style="margin-top:16px;padding:14px 32px;border-radius:14px" onclick="showBindModal()">立即绑定</button>
    </div>
  </div>

  <!-- Tab: 概览 -->
  <div id="pane-home" class="pane">
    <div class="summary-row" id="summaryStats"></div>
    <div class="report-card" id="barrierCard"></div>
    <div class="report-card" id="weeklyCard"></div>
  </div>

  <!-- Tab: 学习报告 -->
  <div id="pane-report" class="pane">
    <div class="report-card" id="reportDetailCard">
      <div class="card-title"><span class="material-icons">description</span>学习报告</div>
      <div id="reportContent"><div class="loading"><div class="spinner"></div></div></div>
    </div>
  </div>

  <!-- Tab: 消息 -->
  <div id="pane-notif" class="pane">
    <div class="report-card">
      <div class="card-title"><span class="material-icons">notifications</span>消息通知</div>
      <div id="notifList"></div>
    </div>
  </div>

</div>

<!-- ═══ Ask AI button ═══ -->
<button class="ask-ai" id="askAiBtn" onclick="openChat()">
  <span class="material-icons">forum</span> 问问 AI 助手
</button>

<!-- ═══ Chat overlay ═══ -->
<div class="chat-overlay" id="chat">
  <div class="chat-head">
    <button class="back-btn" onclick="closeChat()"><span class="material-icons">arrow_back</span></button>
    <span class="title">AI 家长助手</span>
    <button class="back-btn" onclick="var el=document.getElementById('parentConvList');el.style.display=el.style.display==='none'?'block':'none'" style="margin-left:auto"><span class="material-icons" style="font-size:18px">history</span></button>
  </div>
  <div style="padding:6px 14px;border-bottom:1px solid var(--divider);display:none" id="parentConvList"></div>
  <div class="chat-body" id="chatBody">
    <div style="text-align:center;padding:30px 20px;color:var(--ink-light);font-size:15px;line-height:1.7">
      我是 ChemAI 家长助手。<br>可以问我孩子的学习情况、<br>成长空间、以及在家怎么配合。
    </div>
  </div>
  <div class="quick-prompts">
    <span class="quick-prompt" onclick="sendMsg('孩子这周学习怎么样?')">孩子这周怎么样?</span>
    <span class="quick-prompt" onclick="sendMsg('需要重点关注什么?')">需要重点关注什么?</span>
    <span class="quick-prompt" onclick="sendMsg('在家怎么帮孩子?')">在家怎么帮孩子?</span>
  </div>
  <div class="chat-input-bar">
    <input id="chatInput" type="text" placeholder="输入问题..." onkeydown="if(event.key==='Enter')sendMsg()">
    <button onclick="sendMsg()"><span class="material-icons">send</span></button>
  </div>
</div>

<!-- ═══ Bind modal ═══ -->
<div class="modal-overlay" id="bindModal">
  <div class="modal">
    <h3>绑定孩子</h3>
    <label>学生 ID（学号）</label>
    <input type="text" id="bindSid" placeholder="输入孩子的学号，如 202610101">
    <label>绑定码（由学生在自己客户端获取）</label>
    <input type="text" id="bindCode" placeholder="6 位数字" maxlength="6">
    <div class="btn-row">
      <button class="btn btn-cancel" onclick="closeBindModal()">取消</button>
      <button class="btn btn-confirm" onclick="doBind()">确认绑定</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════
var TOKEN = localStorage.getItem('token') || '';
var USER = null;
var PARENT_ID = '';
var CHILDREN = [];
var ACTIVE_CHILD = null;
var ACTIVE_TAB = 'home';

// Init
var u = sessionStorage.getItem('chemai_user');
if (u) {
  try { USER = JSON.parse(u); PARENT_ID = USER.id || ''; }
  catch(e) { window.location.href = '/login.html'; }
}
if (!TOKEN || !USER) window.location.href = '/m/parent-login.html';

setGreeting();
document.getElementById('parentName').textContent = USER.name || '家长';
loadChildren();

// ═══════════════════════════════════════════════════════════════════
// API helpers
// ═══════════════════════════════════════════════════════════════════
function api(path, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body && typeof opts.body === 'object') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(path, opts).then(function(r) {
    if (r.status === 401) { window.location.href = '/login.html'; throw new Error('unauthorized'); }
    return r.json();
  });
}

// ═══════════════════════════════════════════════════════════════════
// Children
// ═══════════════════════════════════════════════════════════════════
function updateBindIcon() {
  var icon = document.getElementById('bindIcon')
  if (CHILDREN.length > 0) {
    icon.textContent = 'link_off'
    document.getElementById('bindBtn').title = '管理绑定'
  } else {
    icon.textContent = 'add_link'
    document.getElementById('bindBtn').title = '绑定孩子'
  }
}

function loadChildren() {
  if (!PARENT_ID) return;
  api('/api/parent/children?parent_id=' + encodeURIComponent(PARENT_ID))
    .then(function(data) {
      if (data.success && data.children && data.children.length > 0) {
        CHILDREN = data.children;
        selectChild(CHILDREN[0]);
        updateBindIcon();
      } else {
        showEmpty();
      }
    })
    .catch(function() { showEmpty(); });
}

function selectChild(child) {
  ACTIVE_CHILD = child;
  document.getElementById('childBar').style.display = 'flex';
  document.getElementById('tabBar').style.display = 'flex';
  document.getElementById('childInitial').textContent = (child.student_name || '?')[0];
  document.getElementById('childName').textContent = child.student_name;
  document.getElementById('childClass').textContent = (child.grade||'') + ' ' + (child.class_name||'');
  showPane('home');
  switchTab('home');
}

function showEmpty() {
  document.getElementById('childBar').style.display = 'none';
  document.getElementById('tabBar').style.display = 'none';
  showPane('empty');
}

// ═══════════════════════════════════════════════════════════════════
// Tabs
// ═══════════════════════════════════════════════════════════════════
function switchTab(name) {
  ACTIVE_TAB = name;
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.textContent === {home:'概览',report:'学习报告',notif:'消息'}[name]);
  });
  showPane(name);
  if (name === 'home') loadHome();
  else if (name === 'report') loadReport();
  else if (name === 'notif') loadNotifications();
}

function showPane(name) {
  ['empty','home','report','notif'].forEach(function(p) {
    var el = document.getElementById('pane-'+p); if (el) el.classList.toggle('active', p === name);
  });
}

// ═══════════════════════════════════════════════════════════════════
// Home — load summary + barrier + weekly
// ═══════════════════════════════════════════════════════════════════
function loadHome() {
  if (!ACTIVE_CHILD) return;
  var sid = ACTIVE_CHILD.student_id;

  // Summary stats from report endpoint
  api('/api/parent/child/' + sid + '/report?parent_id=' + encodeURIComponent(PARENT_ID))
    .then(function(d) {
      if (!d.success) return;
      var r = d.report;
      var barrier = r.barrier_type || {};
      var concept = Math.round((barrier.concept || 0.33) * 100);
      var reading = Math.round((barrier.reading || 0.5) * 100);
      var expression = Math.round((barrier.expression || 0.17) * 100);

      document.getElementById('summaryStats').innerHTML =
        '<div class="stat-card">' +
          '<div class="stat-label">已完成练习</div>' +
          '<div class="stat-value">' + (r.exercises_completed || 0) + '<span class="stat-unit"> 道</span></div>' +
          '<div class="stat-sub"><span class="material-icons">check_circle</span> 持续进步中</div>' +
        '</div>' +
        '<div class="stat-card">' +
          '<div class="stat-label">最近练习</div>' +
          '<div class="stat-value">' + (r.last_exercise_at ? formatDate(r.last_exercise_at) : '—') + '</div>' +
          '<div class="stat-sub" style="color:var(--ink-light)">最后练习日期</div>' +
        '</div>';

      document.getElementById('barrierCard').innerHTML =

        '</div>' +

    });

  // Weekly

        '</div>' +

          '<div class="weekly-item"><div class="w-icon improve"><span class="material-icons">trending_up</span></div>' +

function barItem(label, pct, cls) {
  return '<div class="barrier-item">' +
    '<div class="barrier-header"><span class="bar-name">' + label + '</span><span class="bar-pct">' + pct + '%</span></div>' +
    '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
  '</div>';
}

function barrierText(concept, reading, expression) {
  var dominant = '';
  var advice = '';
  if (reading >= concept && reading >= expression) {
    dominant = '审题仔细度';
    advice = '建议每天花 5 分钟陪孩子一起读一道题，让他把「题目给了什么条件」说出来。';
  } else if (concept >= expression) {
    dominant = '概念理解';
    advice = '可以让孩子用自己的话复述知识点，能讲出来才说明真的懂了。';
  } else {
    dominant = '答题表述';
    advice = '鼓励孩子写完整的解题过程，不只是结果。化学符号和方程式要写规范。';
  }
  return '<span class="highlight">学习建议：' + dominant + '。</span>' + advice;
}

function dominantBarrierName(barrier) {
  if (!barrier || typeof barrier !== 'object') return '—';
  var entries = Object.entries(barrier);
  if (!entries.length) return '—';
  var dom = entries.sort(function(a,b) { return b[1] - a[1]; })[0][0];
  return {concept:'概念理解', reading:'审题仔细度', expression:'答题表述'}[dom] || dom;
}

var PARENT_CID = localStorage.getItem('chemai_parent_cid') || ''

function deleteParentConvo(tid) {

function renderParentConvos() {

  el.innerHTML = PARENT_CONVS.slice(0, 10).map(function(c) {

      '<span onclick="event.stopPropagation();deleteParentConvo(\'' + c.thread_id + '\')" style="font-size:16px;color:#bbb;padding:0 4px;cursor:pointer" title="删除">&times;</span>' +

  }).join('')
}

function switchParentConvo(tid) {
  PARENT_CID = tid; localStorage.setItem('chemai_parent_cid', PARENT_CID)
  renderParentConvos()
  // Load history from server
  var body = document.getElementById('chatBody')
  body.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:14px">加载中…</div>'
  fetch('/api/agent/chat/history/' + tid)
    .then(function(r) { return r.json() })
    .then(function(d) {
      body.innerHTML = ''
      if (d.messages && d.messages.length) {
        d.messages.forEach(function(m) {
          if (m.role === 'human' || m.role === 'user') addChatMsg('user', m.content)
          else if (m.role === 'ai' || m.role === 'assistant') addChatMsg('ai', m.content)
        })
      } else {
        body.innerHTML = '<div style="text-align:center;padding:30px;color:#999;font-size:14px">开始跟 AI 家长助手聊天吧</div>'
      }
    }).catch(function() { body.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:14px">加载失败</div>' })
}

function sendMsg(text) {
  var inp = document.getElementById('chatInput');
  var t = (text || inp.value).trim();
  if (!t) return;
  inp.value = '';
  inp.disabled = true; setTimeout(function() { inp.disabled = false; inp.focus(); }, 500);
  addChatMsg('user', t);

  var th = addThinking();
  var aiEl = null, full = '';
  var bodyEl = document.getElementById('chatBody');

  fetch('/api/agent/chat/langgraph/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ persona: 'parent', message: t, provider: 'deepseek', conversation_id: PARENT_CID, version: 'v2', student_id: (ACTIVE_CHILD||{}).student_id||'' })
  }).then(function(r) {
    var reader = r.body.getReader();
    var dec = new TextDecoder();
    var buf = '';
    function pump() {
      reader.read().then(function(res) {
        if (res.done) { if (th) th.remove(); return; }
        buf += dec.decode(res.value, { stream: true });
        var lines = buf.split('\n'); buf = lines.pop() || '';
        lines.forEach(function(line) {
          if (!line.startsWith('data: ')) return;
          var d = line.slice(6); if (d === '[DONE]') return;
          try { var j = JSON.parse(d); } catch(e) { return; }
          if (j.type === 'text') {
            if (th) { th.remove(); th = null; }
            full += j.content || '';
            if (!aiEl) { aiEl = addChatMsg('ai', ''); aiEl._full = ''; }
            aiEl._full += j.content || '';
            aiEl.innerHTML = renderChemMD(aiEl._full);
            bodyEl.scrollTop = bodyEl.scrollHeight;
          } else if (j.type === 'tool_call') {
            if (th) { th.remove(); th = null; }
            var card = addChatMsg('system', '<div class="tool-card"><div class="head"><span class="material-icons" style="font-size:16px">build</span> ' + esc(j.name||'') + '</div>处理中…</div>');
            card._toolName = j.name;
          } else if (j.type === 'tool_result') {
            // 更新最新的匹配工具卡片为完成
            var cards = document.querySelectorAll('#chatBody .tool-card');
            for (var ci = cards.length - 1; ci >= 0; ci--) {
              var hd = cards[ci].querySelector('.head');
              if (hd && hd.textContent.indexOf('处理中') !== -1) {
                hd.innerHTML = hd.innerHTML.replace('处理中…', '已完成');
                break;
              }
            }
          } else if (j.type === 'component') {
            var msg = j.params && j.params.report ? '已生成学习报告' : (j.params && j.params.summary ? j.params.summary : '');
            if (msg) addChatMsg('ai', msg);
          }
        });
        pump();
      });
    }
    pump();
  });
}

function addChatMsg(role, text) {
  var body = document.getElementById('chatBody');
  var el = document.createElement('div');
  el.className = 'msg msg-' + role;
  if (typeof text === 'string') el.innerHTML = text;
  else el.textContent = text;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  return el;
}

function addThinking() {
  var body = document.getElementById('chatBody');
  var el = document.createElement('div');
  el.className = 'thinking';
  el.innerHTML = '<span class="material-icons" style="font-size:16px;color:var(--accent)">psychology</span> 正在分析…';
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  return el;
}

function doBind() {

    body: { student_id: sid, bind_code: code, parent_id: PARENT_ID, relation: '家长' }
  }).then(function(d) {
    if (d.success) { closeBindModal(); loadChildren(); }
    else { alert(d.message || d.detail || '绑定失败'); }
  }).catch(function() { alert('网络错误，请重试'); });
}

function doLogout() {
  localStorage.removeItem('token');
  sessionStorage.removeItem('chemai_user');
  window.location.href = '/login.html';
}

// ═══════════════════════════════════════════════════════════════════
// Helpers
// ═══════════════════════════════════════════════════════════════════
function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function formatDate(s) {
  if (!s) return '';
  var d = new Date(s);
  if (isNaN(d.getTime())) return s.slice(0, 10);
  var now = new Date();
  if (d.toDateString() === now.toDateString()) return '今天 ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function pad(n) { return n < 10 ? '0'+n : ''+n; }

function setGreeting() {
  var h = new Date().getHours();
  var g = h < 6 ? '夜深了' : h < 12 ? '早上好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  document.getElementById('greeting').textContent = g;
}

// Simple KaTeX rendering
function renderChemMD(text) {
  if (!text) return '';
  var out = text;
  // 先做基础markdown渲染 (app.js 的 renderMD)
  if (typeof renderMD === 'function') out = renderMD(out);
  // 再做 KaTeX 渲染
  out = out.replace(/\$([^$]+)\$/g, function(_, formula) {
    try { return katex.renderToString(formula, { throwOnError: false }); }
    catch(e) { return '<code>' + esc(formula) + '</code>'; }
  });
  return out;
}
