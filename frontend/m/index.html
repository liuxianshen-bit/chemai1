<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 化学助教</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
.material-icons{font-size:24px;line-height:1;vertical-align:middle}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#f7f4ed;color:#1a1a1a;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  min-height:100dvh;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.chat{
  flex:1;overflow-y:auto;padding:12px 14px 4px;
  display:flex;flex-direction:column;gap:8px;
  -webkit-overflow-scrolling:touch;
}
.chat::after{content:'';display:block;height:4px}
.msg{
  max-width:84%;padding:10px 14px;border-radius:18px;
  font-size:14px;line-height:1.65;word-break:break-word;
  animation:in .2s ease;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-user{
  align-self:flex-end;background:#b43c28;color:#fff;border-bottom-right-radius:6px;
}
.msg-ai{
  align-self:flex-start;background:#fff;border-bottom-left-radius:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);color:#1a1a1a;
}
.msg-ai strong{color:#8b2918}
.thinking{
  align-self:flex-start;background:#fff;padding:10px 16px;border-radius:18px;
  border-bottom-left-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  font-size:13px;color:#888;display:flex;align-items:center;gap:6px;
}
.thinking .dots{display:flex;gap:3px}
.thinking .dots span{width:5px;height:5px;border-radius:50%;background:#bbb;animation:dot 1.2s infinite}
.thinking .dots span:nth-child(2){animation-delay:.2s}
.thinking .dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
.tool-card{
  background:#faf8f3;border:1px solid rgba(180,60,40,.08);
  border-radius:10px;padding:8px 10px;font-size:12px;margin:2px 0;
}
.tool-card .head{color:#b43c28;font-weight:600;margin-bottom:2px;font-size:11.5px}
.msg-system{
  align-self:center;font-size:11.5px;color:#aaa;padding:2px 0;text-align:center;max-width:90%;
}
/* Chips */
.chips{
  display:flex;gap:8px;padding:4px 14px 8px;overflow-x:auto;
  flex-shrink:0;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;padding:7px 14px;border-radius:20px;
  border:1px solid rgba(0,0,0,.1);font-size:12.5px;
  cursor:pointer;background:#fff;color:#555;
  display:flex;align-items:center;gap:5px;flex-shrink:0;transition:.15s;
}
.chip:active{background:#b43c28;color:#fff;border-color:#b43c28}
/* Input */
.input-bar{
  display:flex;gap:8px;padding:8px 14px;background:#fff;
  border-top:1px solid rgba(0,0,0,.06);flex-shrink:0;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
}
.input-bar input{
  flex:1;padding:10px 14px;border:1.5px solid #e8e4db;
  border-radius:22px;font-size:14px;outline:none;background:#faf8f3;transition:.15s;
}
.input-bar input:focus{border-color:#b43c28;background:#fff}
.input-bar button{
  width:40px;height:40px;border-radius:50%;border:none;
  background:#b43c28;color:#fff;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(180,60,40,.25);transition:transform .15s;
}
.input-bar button:active{transform:scale(.9)}
/* Empty */
.empty{text-align:center;padding:50px 30px}
.empty .icon{font-size:48px;margin-bottom:12px;opacity:.3;color:#b43c28}
.empty h2{font-size:16px;font-weight:600;color:#555;margin-bottom:4px}
.empty p{font-size:13px;color:#999;line-height:1.6}
</style>
</head><body>

<div id="header"></div>
<div class="chat" id="chat">
  <div class="empty">
    <div class="icon"><span class="material-icons" style="font-size:48px;color:rgba(180,60,40,.3)">auto_awesome</span></div>
    <h2>你好，我是你的 AI 化学助教</h2>
    <p>有任何化学问题都可以问我<br>我会一步一步引导你找到答案</p>
  </div>
</div>

<div class="chips">
  <button class="chip" onclick="quick('帮我配平化学方程式')"><span class="material-icons" style="font-size:16px">tune</span>配平</button>
  <button class="chip" onclick="quick('出几道选择题给我练练手')"><span class="material-icons" style="font-size:16px">create</span>出题</button>
  <button class="chip" onclick="quick('给我演示钠和水的反应')"><span class="material-icons" style="font-size:16px">biotech</span>实验</button>
  <button class="chip" onclick="quick('给我讲讲盐类水解的原理')"><span class="material-icons" style="font-size:16px">import_contacts</span>讲解</button>
</div>

<div class="input-bar">
  <input id="inp" placeholder="输入化学问题..." onkeydown="if(event.key==='Enter')send()">
  <button onclick="send()"><span class="material-icons" style="font-size:18px">send</span></button>
</div>

<div id="tabbar"></div>

<script src="/m/app.js"></script>
<script>
var u=requireAuth();if(!u)throw new Error('no auth')
document.getElementById('header').appendChild(renderHeader('智辅化学','ChemAI'))
document.getElementById('tabbar').appendChild(renderTabBar('chat'))

var chat=document.getElementById('chat'),cid='m-'+Date.now()

function addMsg(role,html){
  var e=chat.querySelector('.empty');if(e)e.remove()
  var d=document.createElement('div');d.className='msg msg-'+role
  d.innerHTML=html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d
}

function thinking(){
  var e=chat.querySelector('.empty');if(e)e.remove()
  var d=document.createElement('div');d.className='thinking'
  d.innerHTML='<div class="dots"><span></span><span></span><span></span></div>思考中...'
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d
}

function quick(t){document.getElementById('inp').value=t;send()}

function send(){
  var inp=document.getElementById('inp'),t=inp.value.trim();if(!t)return
  inp.value='';inp.disabled=true;setTimeout(function(){inp.disabled=false;inp.focus()},500)
  addMsg('user',esc(t))

  var th=thinking(),aiEl=null,full=''

  fetch('/api/agent/chat/langgraph/stream',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({persona:'student',message:t,provider:'deepseek',conversation_id:cid})
  }).then(function(r){
    var reader=r.body.getReader(),dec=new TextDecoder(),buf=''
    function pump(){
      reader.read().then(function(res){
        if(res.done){if(th)th.remove();return}
        buf+=dec.decode(res.value,{stream:true})
        var lines=buf.split('\n');buf=lines.pop()||''
        lines.forEach(function(line){
          if(!line.startsWith('data: '))return
          var d=line.slice(6);if(d==='[DONE]')return
          try{var j=JSON.parse(d)}catch(e){return}
          if(j.type==='text'||j.type==='subagent_text'){
            if(th){th.remove();th=null}
            full+=j.content||''
            if(!aiEl){aiEl=addMsg('ai','');aiEl._t=''}
            aiEl._t+=j.content||''
            aiEl.innerHTML=renderMD(aiEl._t);chat.scrollTop=chat.scrollHeight
          }else if(j.type==='tool_call'){
            if(th){th.remove();th=null}
            addMsg('system','<div class="tool-card"><div class="head"><span class="material-icons" style="font-size:16px">build</span> '+esc(j.name||'')+'</div>处理中...</div>')
          }else if(j.error){
            if(th){th.remove();th=null}
            addMsg('system','⚠ '+esc(j.error))
          }
        })
        if(!res.done)pump()
      })
    };pump()
  }).catch(function(e){
    if(th)th.remove();addMsg('system','网络错误，请重试')
    document.getElementById('inp').disabled=false
  })
}
</script>
</body></html>
