<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的练习</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
.material-icons{font-size:24px;line-height:1;vertical-align:middle}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#f7f4ed;color:#1a1a1a;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px}
.task-card{
  padding:14px 16px;border-radius:10px;border:1px solid rgba(0,0,0,.06);
  margin-bottom:8px;background:#fff;cursor:pointer;transition:.15s;
}
.task-card:active{background:#faf8f3}
.task-card .title{font-size:15px;font-weight:600;margin-bottom:6px}
.task-card .meta{font-size:12.5px;color:#555;display:flex;gap:12px;margin-bottom:6px}
.tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:8px;background:rgba(180,60,40,.06);color:#b43c28;margin-right:4px}
.section-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px;margin:16px 0 10px}
/* Quiz */
.quiz-header{
  padding:8px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(0,0,0,.06);flex-shrink:0;
}
.quiz-body{flex:1;overflow-y:auto;padding:20px}
.quiz-q{font-size:15px;line-height:1.8;color:#1a1a1a;margin-bottom:24px}
.quiz-opt{
  padding:14px 16px;border-radius:10px;border:1.5px solid rgba(0,0,0,.1);
  margin-bottom:10px;font-size:14px;cursor:pointer;transition:.15s;background:#fff;
}
.quiz-opt.sel{border-color:#b43c28;background:rgba(180,60,40,.06);color:#b43c28}
.quiz-bar{
  padding:10px 14px;border-top:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-between;
}
.btn{
  padding:10px 20px;border-radius:20px;border:1px solid rgba(0,0,0,.1);
  font-size:14px;cursor:pointer;background:#fff;color:#555;
}
.btn.primary{padding:10px 28px;background:#b43c28;color:#fff;border:none}
.btn.green{padding:10px 28px;background:#2c6e49;color:#fff;border:none}
.btn:disabled{opacity:.3;pointer-events:none}
/* Loading */
.loading{text-align:center;padding:40px;color:#888;font-size:14px}
/* Result */
.result{text-align:center;padding:30px 20px}
.result .score{font-size:48px;font-weight:700;color:#2c6e49;font-family:Cormorant Garamond,serif}
</style>
</head><body>

<div id="header"></div>
<div id="content" class="page"><div class="loading">加载中...</div></div>
<div id="tabbar"></div>

<script src="/m/app.js"></script>
<script>
var u=requireAuth();if(!u)throw new Error('no auth')
document.getElementById('header').appendChild(renderHeader('我的练习','Practice'))
document.getElementById('tabbar').appendChild(renderTabBar('practice'))

var state={view:'list',tasks:[],quiz:[],qIdx:0,answers:{},practiceId:''}
var el=document.getElementById('content')

function loadTasks(){
  el.innerHTML='<div class="loading">加载中...</div>'
  api('/api/practice/student/'+u.id+'/tasks?page_size=50').then(function(d){
    state.tasks=(d.data&&d.data.tasks)||d.tasks||[]
    if(!state.tasks.length){el.innerHTML='<div class="loading">暂无练习任务</div>';return}
    renderList()
  }).catch(function(e){el.innerHTML='<div class="loading">加载失败: '+e.message+'</div>'})
}

function renderList(){
  var pending=state.tasks.filter(function(t){return t.status!=='completed'})
  var done=state.tasks.filter(function(t){return t.status==='completed'})
  var h=''
  h+='<div class="section-label">待完成 — '+pending.length+' 项</div>'
  if(!pending.length)h+='<div style="color:#888;font-size:13px;padding:8px 0">暂无待完成的练习</div>'
  pending.forEach(function(t){
    h+='<div class="task-card" onclick="startPractice(\''+escAttr(t.practice_id||t.id)+'\')">'
    h+='<div class="title">'+esc(t.title||'练习')+'</div>'
    h+='<div class="meta"><span>'+esc(t.question_count||'?')+' 题</span><span>'+(t.difficulty||'中等')+'</span><span>截止 '+formatDate(t.deadline||t.due_date)+'</span></div>'
    h+='<div>'+(t.knowledge_points||[]).map(function(k){return '<span class="tag">'+esc(k)+'</span>'}).join('')+'</div>'
    h+='</div>'
  })
  if(done.length){
    h+='<div class="section-label">已完成 — '+done.length+' 项</div>'
    done.forEach(function(t){
      h+='<div class="task-card" style="opacity:.7"><div class="title">'+esc(t.title||'练习')+'</div>'
      h+='<div class="meta"><span>得分: '+(t.score||'?')+'/'+(t.total||'?')+'</span></div></div>'
    })
  }
  el.innerHTML=h
}

function escAttr(s){return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function startPractice(pid){
  el.innerHTML='<div class="loading">加载题目...</div>'
  api('/api/practice/student/'+u.id+'/practice/'+pid).then(function(d){
    state.view='quiz';state.quiz=(d.data&&d.data.questions)||d.questions||[]
    if(!state.quiz.length){el.innerHTML='<div class="loading">暂无题目</div>';return}
    state.qIdx=0;state.answers={};state.practiceId=pid
    renderQuiz()
  }).catch(function(e){el.innerHTML='<div class="loading">加载失败: '+e.message+'</div>'})
}

function renderQuiz(){
  var q=state.quiz[state.qIdx];if(!q)return
  var h='<div class="quiz-header">'
  h+='<span class="material-icons" onclick="backToList()" style="font-size:20px;cursor:pointer;color:#555">close</span>'
  h+='<span style="font-size:13px;font-weight:500">'+(state.qIdx+1)+' / '+state.quiz.length+'</span>'
  h+='<div style="width:20px"></div></div>'
  h+='<div class="quiz-body">'
  h+='<div class="quiz-q">'+esc(q.content||q.question||'')+'</div>'
  var opts=q.options||[]
  opts.forEach(function(o,i){
    var sel=state.answers[state.qIdx]===i
    h+='<div class="quiz-opt'+(sel?' sel':'')+'" onclick="selectOpt('+i+')">'+esc(String(o).replace(/^[A-F]\.\s*/,''))+'</div>'
  })
  h+='</div>'
  h+='<div class="quiz-bar">'
  h+='<button class="btn" onclick="prevQ()" '+(state.qIdx===0?'disabled':'')+'>上一题</button>'
  if(state.qIdx<state.quiz.length-1){
    h+='<button class="btn primary" onclick="nextQ()">下一题</button>'
  }else{
    h+='<button class="btn green" onclick="submitAnswers()">提交</button>'
  }
  h+='</div>'
  el.innerHTML=h
}

function selectOpt(i){state.answers[state.qIdx]=i;renderQuiz()}
function prevQ(){if(state.qIdx>0){state.qIdx--;renderQuiz()}}
function nextQ(){if(state.qIdx<state.quiz.length-1){state.qIdx++;renderQuiz()}}

function backToList(){state.view='list';renderList()}

function submitAnswers(){
  var answers=[]
  state.quiz.forEach(function(q,i){
    answers.push({question_id:q.question_id||q.id,student_answer:String(state.answers[i]||'')})
  })
  el.innerHTML='<div class="loading">提交中...</div>'
  api('/api/practice/submit',{method:'POST',body:JSON.stringify({
    practice_id:state.practiceId,student_id:u.id,answers:answers
  })}).then(function(d){
    var correct=d.correct_count||d.correct||0
    var total=d.total_count||state.quiz.length
    el.innerHTML='<div class="result">'
    el.innerHTML+='<div class="score">'+correct+'/'+total+'</div>'
    el.innerHTML+='<div style="font-size:16px;color:#888;margin:4px 0 20px">正确率 '+(total>0?Math.round(correct/total*100):0)+'%</div>'
    el.innerHTML+='<button class="btn primary" onclick="backToList()">返回练习列表</button>'
    el.innerHTML+='</div>'
  }).catch(function(e){el.innerHTML='<div class="loading">提交失败: '+e.message+'</div>'})
}

loadTasks()
</script>
</body></html>
