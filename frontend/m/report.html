<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
.material-icons{font-size:24px;line-height:1;vertical-align:middle}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#f7f4ed;color:#1a1a1a;
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
}
.profile{
  padding:20px 16px 16px;
  background:linear-gradient(180deg,#f5efe0 0%,#f7f4ed 100%);
  border-bottom:1px solid rgba(180,60,40,.06);
}
.profile .avatar{
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#b43c28,#8b2918);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:600;
  font-family:Cormorant Garamond,Noto Serif SC,serif;
}
.stats{display:flex;margin-top:18px;gap:10px}
.stat{
  flex:1;text-align:center;padding:10px 6px;border-radius:8px;
  background:rgba(255,255,255,.7);
}
.stat .v{font-size:24px;font-weight:700;color:#b43c28;font-family:Cormorant Garamond,serif}
.stat .v span{font-size:11px;font-weight:400}
.stat .l{font-size:11px;color:#888;margin-top:2px}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px}
.menu-item{
  padding:14px 16px;border-radius:10px;border:1px solid rgba(0,0,0,.06);
  margin-bottom:8px;background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
}
.menu-item .icon{font-size:22px;color:#b43c28;margin-right:12px}
.menu-item .label{font-size:15px;font-weight:500}
.menu-item .desc{font-size:11.5px;color:#888;margin-top:1px}
.logout{
  padding:14px;text-align:center;font-size:13px;color:#b43c28;
  cursor:pointer;border-top:1px solid rgba(0,0,0,.06);
}
</style>
</head><body>

<div id="header"></div>
<div id="content" class="page">
  <div class="profile">
    <div style="display:flex;align-items:center;gap:14px">
      <div class="avatar" id="avatar-initial"></div>
      <div>
        <div id="profile-name" style="font-size:18px;font-weight:600"></div>
        <div id="profile-class" style="font-size:12.5px;color:#888;margin-top:2px"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v">—</div><div class="l">练习完成</div></div>
      <div class="stat"><div class="v">—</div><div class="l">待复习</div></div>
      <div class="stat"><div class="v">—</div><div class="l">正确率</div></div>
    </div>
  </div>
  <div class="menu-item" onclick="showReportDetail()">
    <div style="display:flex;align-items:center">
      <span class="material-icons icon">trending_up</span>
      <div><div class="label">学习报告</div><div class="desc">成绩趋势与知识点分析</div></div>
    </div>
    <span class="material-icons" style="color:#bbb;font-size:20px">chevron_right</span>
  </div>
  <div class="menu-item" onclick="location.href='/m/review.html'">
    <div style="display:flex;align-items:center">
      <span class="material-icons icon">book</span>
      <div><div class="label">复习中心</div><div class="desc">艾宾浩斯间隔复习</div></div>
    </div>
    <span class="material-icons" style="color:#bbb;font-size:20px">chevron_right</span>
  </div>
  <div class="menu-item" onclick="showLearningPlan()">
    <div style="display:flex;align-items:center">
      <span class="material-icons icon">assignment</span>
      <div><div class="label">学习计划</div><div class="desc">个性化学习任务</div></div>
    </div>
    <span class="material-icons" style="color:#bbb;font-size:20px">chevron_right</span>
  </div>
  <div class="menu-item" onclick="showSettings()">
    <div style="display:flex;align-items:center">
      <span class="material-icons icon">settings</span>
      <div><div class="label">个人设置</div><div class="desc">账号、绑定码与关于</div></div>
    </div>
    <span class="material-icons" style="color:#bbb;font-size:20px">chevron_right</span>
  </div>
</div>

<div class="logout" onclick="doLogout()">退出登录</div>

<div id="tabbar"></div>

<script src="/m/app.js"></script>
<script>
var u=requireAuth();if(!u)throw new Error('no auth')
document.getElementById('header').appendChild(renderHeader('我的','Profile'))
document.getElementById('tabbar').appendChild(renderTabBar('me'))

document.getElementById('avatar-initial').textContent=(u.name||'学')[0]
document.getElementById('profile-name').textContent=u.name||'学生'
document.getElementById('profile-class').textContent=(u.class_name||u.class||'')+' · '+u.id

// Load stats from student data
api('/api/diagnosis/plan/'+u.id).then(function(d){
  if(!d.success)return
  var data = d.data || {}
  var totalAnswers = data.total_answers || data.exercises_completed || 0
  var accuracy = data.accuracy || 0
  var weakKps = data.weak_knowledge_points || []
  var stats=document.querySelectorAll('.stat .v')
  stats[0].innerHTML = totalAnswers
  stats[1].innerHTML = weakKps.length
  stats[2].innerHTML = Math.round(accuracy*100)+'<span>%</span>'
}).catch(function(){})

function doLogout(){
  sessionStorage.clear();localStorage.removeItem('token')
  location.href='/m/login.html'
}

// 学习计划弹窗
function showLearningPlan(){
  var u=getUser(); if(!u)return
  api('/api/diagnosis/learning-plan/'+u.id).then(function(d){
    var plan=(d.data||d).plan||d.plan
    if(!plan){
      api('/api/diagnosis/learning-plan/generate',{method:'POST',body:JSON.stringify({student_id:u.id,class_id:u.class_id})}).then(function(r){
        showLearningPlan()
      }).catch(function(e){ alert('生成失败: '+e.message) })
      return
    }
    var title = plan.plan_title || '个性化学习计划'
    var period = plan.plan_period || ''
    var weeks = plan.weekly_goals || []
    var tasks = plan.daily_tasks || []
    var barriers = plan.barrier_interventions || {}
    var tips = plan.motivation_tips || []

    var html='<div style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#f7f4ed;max-width:480px;margin:0 auto;overflow-y:auto;display:flex;flex-direction:column">'
    html+='<div style="padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,.06)">'
    html+='<span class="material-icons" onclick="this.closest(\'div\').parentElement.remove()" style="cursor:pointer;font-size:22px">arrow_back</span>'
    html+='<span style="font-weight:600">学习计划</span></div>'
    html+='<div style="flex:1;overflow-y:auto;padding:16px">'
    html+='<div style="font-size:18px;font-weight:700;margin-bottom:4px">'+esc(title)+'</div>'
    if(period) html+='<div style="font-size:12px;color:#888;margin-bottom:12px">周期: '+esc(period)+'</div>'

    if(weeks.length){
      html+='<div style="margin-top:12px;font-weight:600;font-size:14px;color:#2c6e49">周目标</div>'
      weeks.forEach(function(g){
        var goal = typeof g === 'string' ? g : (g.milestone || g.goal || g.text || '')
        html+='<div style="padding:6px 0;font-size:14px;border-bottom:1px solid rgba(0,0,0,.04)">'+esc(goal)+'</div>'
      })
    }
    if(tasks.length){
      html+='<div style="margin-top:12px;font-weight:600;font-size:14px;color:#2c6e49">每日任务</div>'
      tasks.slice(0,14).forEach(function(t){
        var day = t.day || ''
        var task = t.task || t.content || (typeof t === 'string' ? t : '')
        html+='<div style="padding:6px 0;font-size:14px;border-bottom:1px solid rgba(0,0,0,.04)"><span style="color:#888;font-size:12px;margin-right:6px">'+esc(day)+'</span>'+esc(task)+'</div>'
      })
    }
    if(!Array.isArray(barriers) && typeof barriers === 'object' && Object.keys(barriers).length){
      html+='<div style="margin-top:12px;font-weight:600;font-size:14px;color:#2c6e49">障碍干预</div>'
      var bl = {concept:'概念理解', reading:'审题仔细', expression:'答题表述'}
      Object.keys(barriers).forEach(function(b){
        html+='<div style="padding:6px 0;font-size:14px;border-bottom:1px solid rgba(0,0,0,.04)"><b>'+esc(bl[b]||b)+'</b>: '+esc(barriers[b])+'</div>'
      })
    }
    if(tips.length){
      html+='<div style="margin-top:12px;font-weight:600;font-size:14px;color:#2c6e49">激励建议</div>'
      tips.forEach(function(t){
        var tx = typeof t === 'string' ? t : (t.tip || t.text || '')
        html+='<div style="padding:6px 0;font-size:14px;border-bottom:1px solid rgba(0,0,0,.04)">'+esc(tx)+'</div>'
      })
    }
    if(!weeks.length && !tasks.length){
      if(plan.raw_text){
        html+='<div style="font-size:14px;line-height:1.7;white-space:pre-wrap;padding:10px;background:#fff;border-radius:8px;border:1px solid rgba(0,0,0,.06)">'+renderMD(esc(plan.raw_text))+'</div>'
      } else {
        html+='<div style="color:#888;text-align:center;padding:40px">暂无学习计划详情，请联系老师布置</div>'
      }
    }
    html+='</div></div>'
    var div=document.createElement('div');div.innerHTML=html
    document.body.appendChild(div.firstElementChild)
  }).catch(function(e){ alert('加载失败: '+e.message) })
}

// 学习报告内联弹窗
function showReportDetail(){
  var u=getUser(); if(!u)return
  api('/api/report/student/'+u.id).then(function(d){
    if(!d.success){ alert(d.message||'加载失败'); return }
    var r=d.data||d
    var body=document.getElementById('content')
    var html='<div style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#f7f4ed;max-width:480px;margin:0 auto;display:flex;flex-direction:column">'
    html+='<div style="padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,.06)">'
    html+='<span class="material-icons" onclick="this.closest(\'div\').parentElement.remove()" style="cursor:pointer;font-size:22px">arrow_back</span>'
    html+='<span style="font-weight:600">学习报告</span></div>'
    html+='<div style="flex:1;overflow-y:auto;padding:16px">'
    html+='<div style="font-size:20px;font-weight:700;margin-bottom:16px">'+esc(u.name)+' 学习报告</div>'
    html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">'
    html+='<div class="stat"><div class="v">'+(r.exercises_completed||0)+'</div><div class="l">练习完成</div></div>'
    html+='<div class="stat"><div class="v">'+(r.avg_score||'--')+'<span>%</span></div><div class="l">平均正确率</div></div>'
    html+='<div class="stat"><div class="v">'+((r.barrier_type||{}).concept?'概念':'--')+'</div><div class="l">主要障碍</div></div>'
    html+='<div class="stat"><div class="v">'+(r.recent_exams||0)+'</div><div class="l">近期考试</div></div>'
    html+='</div>'
    if(r.trend&&r.trend.length>0){
      html+='<div style="font-weight:600;margin-bottom:6px">成绩趋势</div>'
      for(var i=0;i<r.trend.length;i++){
        html+='<div style="padding:8px;background:#fff;border-radius:6px;margin-bottom:4px;display:flex;justify-content:space-between">'
        html+='<span>'+esc(r.trend[i].exam_name||'')+'</span>'
        html+='<span style="font-weight:600;color:#b43c28">'+r.trend[i].score+'分</span></div>'
      }
    }
    html+='</div></div>'
    var div=document.createElement('div');div.innerHTML=html
    document.body.appendChild(div.firstElementChild)
  }).catch(function(e){ alert('加载失败: '+e.message) })
}

// 个人设置面板
function showSettings(){
  var u=getUser(); if(!u)return
  var html='<div style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#f7f4ed;max-width:480px;margin:0 auto;display:flex;flex-direction:column">'
  html+='<div style="padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,.06)">'
  html+='<span class="material-icons" onclick="this.closest(\'div\').parentElement.remove()" style="cursor:pointer;font-size:22px">arrow_back</span>'
  html+='<span style="font-weight:600;font-size:17px">个人设置</span></div>'
  html+='<div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px">'

  // 个人信息
  html+='<div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)">'
  html+='<div style="font-weight:600;font-size:15px;margin-bottom:12px">个人信息</div>'
  html+='<div style="display:flex;flex-direction:column;gap:8px;font-size:14px">'
  html+='<div style="display:flex;justify-content:space-between"><span style="color:#888">姓名</span><span>'+esc(u.name||'—')+'</span></div>'
  html+='<div style="display:flex;justify-content:space-between"><span style="color:#888">学号</span><span>'+esc(u.id||'—')+'</span></div>'
  html+='<div style="display:flex;justify-content:space-between"><span style="color:#888">班级</span><span>'+esc(u.class_name||u.class||'—')+'</span></div>'
  html+='</div></div>'

  // 绑定码
  html+='<div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)">'
  html+='<div style="font-weight:600;font-size:15px;margin-bottom:8px">家长绑定码</div>'
  html+='<div style="font-size:13px;color:#888;margin-bottom:8px">将此码发给家长，家长在家长端输入后即可绑定查看你的学习情况</div>'
  html+='<div style="display:flex;align-items:center;gap:10px">'
  html+='<span id="bindCodeDisplay" style="font-size:28px;font-weight:700;letter-spacing:8px;color:#2d5a4b">加载中…</span>'
  html+='<button onclick="copyBindCode()" style="padding:8px 14px;border:1px solid #d5d0c6;border-radius:8px;background:#fdfbf7;cursor:pointer;font-size:13px">复制</button>'
  html+='</div><div id="bindCopyMsg" style="font-size:12px;color:#3d8b5e;margin-top:4px;display:none">已复制!</div>'
  html+='</div>'

  // 修改密码
  html+='<div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)">'
  html+='<div style="font-weight:600;font-size:15px;margin-bottom:12px">修改密码</div>'
  html+='<input id="settingsOldPw" type="password" placeholder="当前密码" style="width:100%;padding:10px 12px;border:1.5px solid #e0dcd4;border-radius:8px;font-size:15px;margin-bottom:8px;outline:none">'
  html+='<input id="settingsNewPw" type="password" placeholder="新密码" style="width:100%;padding:10px 12px;border:1.5px solid #e0dcd4;border-radius:8px;font-size:15px;margin-bottom:8px;outline:none">'
  html+='<input id="settingsNewPw2" type="password" placeholder="确认新密码" style="width:100%;padding:10px 12px;border:1.5px solid #e0dcd4;border-radius:8px;font-size:15px;margin-bottom:10px;outline:none">'
  html+='<button onclick="changePassword()" style="width:100%;padding:12px;background:#2d5a4b;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer">确认修改</button>'
  html+='<div id="settingsPwMsg" style="font-size:13px;margin-top:6px;text-align:center"></div>'
  html+='</div>'

  // 关于
  html+='<div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)">'
  html+='<div style="font-weight:600;font-size:15px;margin-bottom:8px">关于</div>'
  html+='<div style="font-size:13px;color:#888;line-height:1.6">智辅化学 (ChemAI) v2.0<br>面向高中化学的 AI 教学辅助平台<br>教师出题 · 学生辅导 · 家长关注</div>'
  html+='</div>'

  html+='</div></div>'
  var div=document.createElement('div');div.innerHTML=html
  document.body.appendChild(div.firstElementChild)
  // 加载绑定码
  api('/api/diagnosis/plan/'+u.id).then(function(d){
    var bc = (d.data||d).bind_code || u.bind_code || ''
    var el = document.getElementById('bindCodeDisplay')
    if (el && bc) el.textContent = bc
    else if (el) el.textContent = '暂无'
  }).catch(function(){ var e=document.getElementById('bindCodeDisplay');if(e)e.textContent='获取失败' })
}

function copyBindCode() {
  var el = document.getElementById('bindCodeDisplay')
  if (!el || !el.textContent || el.textContent === '暂无' || el.textContent === '加载中…') return
  navigator.clipboard.writeText(el.textContent).then(function(){
    var m=document.getElementById('bindCopyMsg');m.style.display='block'
    setTimeout(function(){m.style.display='none'}, 2000)
  }).catch(function(){})
}

function changePassword() {
  var oldPw = document.getElementById('settingsOldPw').value
  var newPw = document.getElementById('settingsNewPw').value
  var newPw2 = document.getElementById('settingsNewPw2').value
  var msg = document.getElementById('settingsPwMsg')
  if (!oldPw || !newPw) { msg.textContent='请填写所有密码字段'; msg.style.color='#b45a4a'; return }
  if (newPw !== newPw2) { msg.textContent='两次新密码不一致'; msg.style.color='#b45a4a'; return }
  if (newPw.length < 4) { msg.textContent='新密码至少4位'; msg.style.color='#b45a4a'; return }
  api('/api/auth/change-password', {
    method:'POST',
    body:JSON.stringify({old_password:oldPw, new_password:newPw})
  }).then(function(d){
    if (d.success) { msg.textContent='密码修改成功'; msg.style.color='#3d8b5e' }
    else { msg.textContent = d.message || d.detail || '修改失败'; msg.style.color='#b45a4a' }
  }).catch(function(e){ msg.textContent='网络错误'; msg.style.color='#b45a4a' })
}
</script>
</body></html>
