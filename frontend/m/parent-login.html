<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>智辅化学 · 家长端</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
<style>
:root {
  --bg:   #f5f0e8;
  --card: #fdfbf7;
  --ink:  #3a3a3a;
  --soft: #7a7a7a;
  --light:#a0a0a0;
  --green:#2d5a4b;
  --gold: #b8935a;
  --input-bg: #faf7f2;
  --radius: 14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink);
  max-width:450px;margin:0 auto;min-height:100dvh;
  font-size:17px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 24px;
}

/* ── Logo area ── */
.logo-area{text-align:center;margin-bottom:40px}
.logo-icon{
  width:72px;height:72px;border-radius:22px;
  background:linear-gradient(135deg,#c4d8ce,#7aab94);
  display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:16px;box-shadow:0 4px 16px rgba(45,90,75,.15);
}
.logo-icon .material-icons{font-size:36px;color:#fff}
.logo-area h1{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:4px}
.logo-area p{font-size:15px;color:var(--soft);line-height:1.5}

/* ── Card ── */
.card{
  width:100%;background:var(--card);border-radius:18px;
  padding:28px 24px;box-shadow:0 2px 12px rgba(0,0,0,.04);
}
.card h2{font-size:18px;font-weight:600;margin-bottom:20px;text-align:center}
.card h2 .material-icons{font-size:22px;vertical-align:-4px;color:var(--green);margin-right:4px}

/* ── Inputs ── */
.field{margin-bottom:18px}
.field label{font-size:15px;color:var(--soft);display:block;margin-bottom:6px}
.field .input-wrap{
  display:flex;align-items:center;gap:10px;
  background:var(--input-bg);border:2px solid #e8e4db;
  border-radius:12px;padding:0 14px;transition:.15s;
}
.field .input-wrap:focus-within{border-color:var(--green);background:#fff}
.field .input-wrap .material-icons{font-size:22px;color:var(--light);flex-shrink:0}
.field input{
  flex:1;padding:14px 0;border:none;background:transparent;
  font-size:17px;outline:none;color:var(--ink);
}
.field input::placeholder{color:#c0bdb6}

/* ── Button ── */
.btn{
  width:100%;padding:16px;border:none;border-radius:14px;
  font-size:18px;font-weight:600;cursor:pointer;
  background:var(--green);color:#fff;
  box-shadow:0 4px 14px rgba(45,90,75,.25);
  transition:transform .15s,opacity .15s;
  margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.97);opacity:.9}
.btn.loading{pointer-events:none;opacity:.7}
.btn .material-icons{font-size:22px}

/* ── Message ── */
.msg{text-align:center;font-size:15px;margin-top:14px;min-height:22px}
.msg.error{color:#b45a4a}
.msg.success{color:var(--green)}
.msg.info{color:var(--soft)}

/* ── Footer ── */
.footer{margin-top:32px;text-align:center}
.footer p{font-size:14px;color:var(--light);line-height:1.6}
.footer a{color:var(--green);text-decoration:none;font-weight:500}

/* ── Bind section (after login) ── */
.bind-section{display:none}
.bind-section h3{font-size:17px;font-weight:600;margin-bottom:16px}
.bind-hint{
  background:#faf5ec;border-left:3px solid var(--gold);
  padding:12px 14px;border-radius:6px;font-size:14px;
  color:var(--ink);margin-bottom:16px;line-height:1.6;
}

/* ── Dashboard preview ── */
.preview{margin-top:24px;text-align:center}
.preview-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.preview-card{
  background:var(--card);border-radius:12px;padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);text-align:center;
}
.preview-card .pv-icon{font-size:28px;margin-bottom:6px;opacity:.7}
.preview-card .pv-label{font-size:13px;color:var(--light)}
.preview-card .pv-value{font-size:22px;font-weight:700;color:var(--green);margin-top:2px}
</style>
</head>
<body>

<div class="logo-area">
  <div class="logo-icon"><span class="material-icons">school</span></div>
  <h1>智辅化学</h1>
  <p>关注孩子的每一步成长</p>
</div>

<!-- ═══ Login form ═══ -->
<div class="card" id="loginCard">
  <h2><span class="material-icons">person</span>家长登录</h2>
  <div class="field">
    <label>手机号 或 用户名</label>
    <div class="input-wrap">
      <span class="material-icons">call</span>
      <input type="text" id="username" placeholder="输入手机号或用户名" autocomplete="username">
    </div>
  </div>
  <div class="field">
    <label>密码</label>
    <div class="input-wrap">
      <span class="material-icons">lock</span>
      <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
    </div>
  </div>
  <button class="btn" onclick="doLogin()" id="loginBtn">
    <span class="material-icons">login</span> 进入
  </button>
  <div class="msg" id="msg"></div>
</div>

<div class="footer">
  <p>还没有账号？<a href="#" onclick="toggleRegister()">注册家长账号</a></p>
  <p style="margin-top:4px;font-size:12px">注册后需绑定孩子的学号和绑定码</p>
</div>

<script>
// ═══════════════════════════════════════════════════
// Login
// ═══════════════════════════════════════════════════
function setMsg(text, cls) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (cls || '');
}

function doLogin() {
  var u = document.getElementById('username').value.trim();
  var p = document.getElementById('password').value.trim();
  if (!u || !p) { setMsg('请填写用户名和密码', 'error'); return; }

  var btn = document.getElementById('loginBtn');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="material-icons" style="animation:spin .8s linear infinite">sync</span> 登录中…';
  setMsg('');

  fetch('/api/parent/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      btn.classList.remove('loading');
      btn.innerHTML = '<span class="material-icons">login</span> 进入';
      if (d.success) {
        setMsg('登录成功，正在进入…', 'success');
        var ud = { id: d.parent_id, username: u, name: d.name, role: 'parent', token: '' };
        sessionStorage.setItem('chemai_user', JSON.stringify(ud));
        localStorage.setItem('token', d.token || '');
        setTimeout(function() { window.location.href = '/m/parent.html'; }, 400);
      } else {
        setMsg(d.message || d.detail || '用户名或密码错误', 'error');
      }
    }).catch(function() {
      btn.classList.remove('loading');
      btn.innerHTML = '<span class="material-icons">login</span> 进入';
      setMsg('网络错误，请检查后端是否启动', 'error');
    });
}

// Enter key
document.getElementById('password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('username').focus();

// Spinner animation
var s = document.createElement('style');
s.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(s);
</script>
</body>
</html>
