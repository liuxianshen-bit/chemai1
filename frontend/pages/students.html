<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>学生管理 - 智辅化学</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script><script>tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#002045","on-primary":"#ffffff","primary-container":"#1a365d","secondary":"#13696a","secondary-container":"#a2eded",surface:"#fbf9f5","surface-warm":"#F5EFE6",background:"#fbf9f5","on-surface":"#1b1c1a","on-surface-variant":"#43474e","wood-accent":"#D7C4B1","outline-variant":"#c4c6cf","formula-green":"#2F855A","academic-red":"#C53030",tertiary:"#290068","tertiary-container":"#420e95"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},fontFamily:{sans:["IBM Plex Sans"],mono:["JetBrains Mono"],display:["Manrope"]}}}}</script>
<link rel="stylesheet" href="/design-system.css"></head>
<body class="bg-background text-on-surface flex h-screen overflow-hidden" style="font-family:'IBM Plex Sans'">
<aside class="fixed left-0 top-0 h-screen flex flex-col z-50" style="width:240px;background:#002045"><div class="h-16 flex items-center px-4 mb-4 mt-2"><span class="material-symbols-outlined text-[28px] mr-2" style="color:#86a0cd">science</span><div><h1 class="text-white font-bold tracking-tight" style="font-family:Manrope;font-size:20px">智辅化学</h1><p class="text-xs" style="color:#86a0cd;font-family:'JetBrains Mono'">智慧教育辅助系统</p></div></div><div class="px-4 mb-6"><a href="/" class="w-full py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-all text-sm no-underline" style="background:rgba(255,255,255,.1);color:#86a0cd;font-family:'JetBrains Mono';display:flex" onmouseover="this.style.background='rgba(255,255,255,.15)';this.style.color='#fff'" onmouseout="this.style.background='rgba(255,255,255,.1)';this.style.color='#86a0cd'"><span class="material-symbols-outlined text-[18px]">psychology</span> AI 教研助手</a></div><nav class="flex-1 overflow-y-auto px-2 flex flex-col gap-1" id="sidebar-nav"></nav><div class="p-2 border-t mt-auto" style="border-color:rgba(255,255,255,.1)"><a class="sidebar-link" href="#" onclick="ChemAI.logout()"><span class="material-symbols-outlined">logout</span> 退出登录</a></div></aside>
<main class="flex-1 flex flex-col relative h-screen bg-background overflow-y-auto" style="margin-left:240px;padding:32px">
<h1 class="text-3xl font-bold mb-6" style="font-family:Manrope;color:#002045">学生管理</h1>
<div class="flex gap-3 mb-6"><input id="student-search" class="input-field flex-1" placeholder="搜索姓名或学号..." oninput="loadStudents(this.value)"><select id="student-class-filter" class="input-field" style="width:160px" onchange="loadStudents()"><option value="">全部班级</option></select></div>
<div id="students-list"></div>
</main>
<div class="modal-overlay" id="student-modal" style="display:none" onclick="if(event.target===this)closeStudentModal()">
<div class="modal-card" style="max-width:720px"><div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold" style="font-family:Manrope;color:#002045" id="modal-name"></h2><button onclick="closeStudentModal()" style="background:none;border:none;cursor:pointer;font-size:24px;color:#74777f">&times;</button></div>
<div class="grid grid-cols-3 gap-4 mb-6" id="modal-stats"></div>
<div class="card mb-4"><h3 class="text-lg font-bold mb-2" style="font-family:Manrope">障碍诊断</h3><div id="modal-barrier"></div></div>
<div class="card mb-4"><h3 class="text-lg font-bold mb-2" style="font-family:Manrope">学情概览</h3><div id="modal-report" class="text-sm" style="color:#43474e"></div></div>
<div class="flex gap-3"><button class="btn-teal" onclick="genPlanForModal()">生成学习计划</button><button class="btn-secondary" onclick="closeStudentModal()">关闭</button></div>
</div></div>
<script src="/app.js"></script><script src="/js/students.js"></script>
</body></html>
