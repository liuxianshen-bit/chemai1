<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>答题卡识别 - 智辅化学</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#002045","on-primary":"#ffffff","primary-container":"#1a365d","on-primary-container":"#86a0cd",secondary:"#13696a","secondary-container":"#a2eded",surface:"#fbf9f5","surface-warm":"#F5EFE6","surface-container-low":"#f5f3ef","surface-container-high":"#eae8e4","on-surface":"#1b1c1a","on-surface-variant":"#43474e","wood-accent":"#D7C4B1","outline-variant":"#c4c6cf","ai-glow":"#E0F2F1",background:"#fbf9f5","on-background":"#1b1c1a","formula-green":"#2F855A","academic-red":"#C53030"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"sidebar-width":"240px","margin-desktop":"32px","component-gap":"16px","section-gap":"40px"},fontFamily:{sans:["IBM Plex Sans"],mono:["JetBrains Mono"],display:["Manrope"]}}}}</script>

<body class="bg-background text-on-surface flex h-screen overflow-hidden" style="font-family:'IBM Plex Sans'">
<aside class="fixed left-0 top-0 h-screen flex flex-col z-50" style="width:240px;background:#002045"><div class="h-16 flex items-center px-4 mb-4 mt-2"><span class="material-symbols-outlined text-[28px] mr-2" style="color:#86a0cd">science</span><div><h1 class="text-white font-bold tracking-tight" style="font-family:Manrope;font-size:20px">智辅化学</h1><p class="text-xs" style="color:#86a0cd;font-family:'JetBrains Mono'">智慧教育辅助系统</p></div></div><div class="px-4 mb-6"><a href="/" class="w-full py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-all text-sm no-underline" style="background:rgba(255,255,255,.1);color:#86a0cd;font-family:'JetBrains Mono';display:flex" onmouseover="this.style.background='rgba(255,255,255,.15)';this.style.color='#fff'" onmouseout="this.style.background='rgba(255,255,255,.1)';this.style.color='#86a0cd'"><span class="material-symbols-outlined text-[18px]">psychology</span> AI 教研助手</a></div><nav class="flex-1 overflow-y-auto px-2 flex flex-col gap-1" id="sidebar-nav"></nav><div class="p-2 border-t mt-auto" style="border-color:rgba(255,255,255,.1)"><a class="sidebar-link" href="#" onclick="ChemAI.logout()"><span class="material-symbols-outlined">logout</span> 退出登录</a></div></aside>
<main class="flex-1 flex flex-col relative h-screen bg-background" style="margin-left:240px">

<div class="flex-1 overflow-y-auto p-8">
  <h1 class="text-3xl font-bold mb-6" style="font-family:Manrope;color:#002045">📷 答题卡识别</h1>
  <div class="card mb-6"><h3 class="text-lg font-bold mb-3" style="font-family:Manrope">选择班级</h3><select id="ocr-class" class="input-field mb-4"><option value="">请选择班级...</option></select></div>
  <div class="card card-accent text-center py-12 cursor-pointer" id="upload-zone" onclick="handleUpload()">
    <span class="material-symbols-outlined text-6xl mb-3" style="color:#002045">cloud_upload</span>
    <h3 class="text-lg font-bold mb-1" style="font-family:Manrope">点击或拖拽上传答题卡</h3>
    <p class="text-sm" style="color:#74777f">支持 JPG / PNG / PDF 文件</p>
    <input type="file" id="file-input" accept="image/*,.pdf" style="display:none" multiple onchange="handleFiles(this.files)">

  <div id="ocr-results"></div>
</div>
</main>

<script src="/js/ocr.js"></script>
