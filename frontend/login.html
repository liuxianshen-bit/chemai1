<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智辅化学 - 登录</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-primary: #FAFAF8;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F4F2EF;
            --bg-accent: #F0EDE8;
            --bg-paper: #FDFCFA;
            --text-primary: #1C1C1C;
            --text-secondary: #5C5C5C;
            --text-muted: #909090;
            --text-inverse: #FAFAF8;
            --accent: #B85C38;
            --accent-hover: #9A4A2A;
            --accent-light: #D4785A;
            --accent-bg: rgba(184, 92, 56, 0.08);
            --teal: #4A7C8C;
            --teal-bg: rgba(74, 124, 140, 0.08);
            --amber: #B8863A;
            --amber-bg: rgba(184, 134, 58, 0.08);
            --purple: #7C6A9C;
            --purple-bg: rgba(124, 106, 156, 0.08);
            --success: #4A8C6A;
            --warning: #B8863A;
            --error: #A85454;
            --barrier-c: #C49A3A;
            --barrier-r: #4A7C8C;
            --barrier-e: #8C6A9C;
            --border: #E5E2DD;
            --border-strong: #CCC8C1;
            --border-dashed: #D5D1CA;
            --shadow-xs: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
            --font-heading: Georgia, 'Times New Roman', serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'Consolas', 'Monaco', monospace;
        }

        html, body { height: 100%; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            line-height: 1.5;
        }

        .login-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
        }

        /* ========== 左侧装饰区 ========== */
        .hero {
            background: var(--bg-paper);
            position: relative;
            overflow: hidden;
            padding: 48px 56px;
            display: flex;
            flex-direction: column;
        }

        /* 分子键线装饰 SVG */
        .molecule-decoration {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0.12;
        }

        /* 品牌区 */
        .hero-content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .brand { margin-bottom: 48px; }

        .brand-label {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .brand-title {
            font-family: var(--font-heading);
            font-size: 3.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1;
            margin-bottom: 8px;
        }

        .brand-title span { color: var(--accent); }

        .brand-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        /* 分子线描装饰 */
        .molecule-divider {
            width: 100%;
            max-width: 360px;
            height: 40px;
            margin: 32px 0;
        }

        .molecule-divider line {
            stroke: var(--border-strong);
            stroke-width: 1.5;
        }
        .molecule-divider circle {
            fill: none;
            stroke: var(--accent);
            stroke-width: 1.5;
        }
        .molecule-divider .accent-circle { fill: var(--accent-bg); }

        /* 特性列表 */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 24px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9375rem;
            color: var(--text-secondary);
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--accent-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .feature-icon svg {
            width: 16px;
            height: 16px;
            stroke: var(--accent);
        }

        /* 底部信息 */
        .hero-footer {
            position: relative;
            z-index: 2;
            padding-top: 32px;
            border-top: 1px solid var(--border);
        }

        .hero-footer p {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ========== 右侧表单区 ========== */
        .form-side {
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
        }

        .form-container { width: 100%; max-width: 400px; }

        .form-header { margin-bottom: 36px; }
        .form-header h2 {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .form-header p { font-size: 0.9375rem; color: var(--text-secondary); }

        /* 表单切换标签 */
        .form-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 32px;
            background: var(--bg-tertiary);
            padding: 4px;
            border-radius: 10px;
        }

        .form-tab {
            flex: 1;
            padding: 10px 16px;
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            background: none;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .form-tab.active {
            background: var(--bg-secondary);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* 表单面板 */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* 表单组 */
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            font-family: var(--font-body);
            font-size: 0.9375rem;
            color: var(--text-primary);
            background: var(--bg-primary);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .form-input::placeholder { color: var(--text-muted); }

        /* 带图标输入框 */
        .input-with-icon { position: relative; }
        .input-with-icon .form-input { padding-right: 48px; }
        .input-icon-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .input-icon-btn:hover { color: var(--text-secondary); }
        .input-icon-btn svg { width: 18px; height: 18px; display: block; }
        .eye-off { display: none; }

        /* 验证码 */
        .verify-row { display: flex; gap: 12px; }
        .verify-row .form-input { flex: 1; }
        .verify-img {
            width: 100px;
            height: 46px;
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: 4px;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        /* 角色选择 */
        .role-select {
            display: flex;
            gap: 10px;
            margin-bottom: 28px;
        }
        .role-btn {
            flex: 1;
            padding: 16px 8px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--bg-primary);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .role-btn:hover {
            border-color: var(--accent);
            background: var(--accent-bg);
        }
        .role-btn.active {
            border-color: var(--accent);
            background: var(--accent-bg);
        }
        .role-btn svg {
            width: 24px;
            height: 24px;
            margin: 0 auto 8px;
            stroke: var(--text-secondary);
            display: block;
        }
        .role-btn.active svg { stroke: var(--accent); }
        .role-btn span {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .role-btn.active span { color: var(--accent); }

        /* 记住登录 */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .checkbox-wrap input { display: none; }
        .checkbox-custom {
            width: 18px;
            height: 18px;
            border: 1.5px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .checkbox-wrap input:checked + .checkbox-custom {
            background: var(--accent);
            border-color: var(--accent);
        }
        .checkbox-custom svg { display: none; width: 11px; height: 11px; color: #fff; }
        .checkbox-wrap input:checked + .checkbox-custom svg { display: block; }
        .checkbox-wrap span { font-size: 0.8125rem; color: var(--text-secondary); }
        .forgot-link {
            font-size: 0.8125rem;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .forgot-link:hover { text-decoration: underline; }

        /* 提交按钮 */
        .btn-submit {
            width: 100%;
            padding: 14px 24px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .btn-submit:hover {
            background: var(--accent-hover);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        /* 分隔线 */
        .divider { display: flex; align-items: center; gap: 16px; margin: 28px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .divider span { font-size: 0.75rem; color: var(--text-muted); }

        /* 快速登录 */
        .quick-entry { text-align: center; }
        .quick-entry p { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 14px; }
        .quick-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-primary);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 0.8125rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-bg);
        }

        /* 演示账号按钮 */
        .demo-accounts {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .demo-account-btn {
            flex: 1;
            padding: 12px 8px;
            background: var(--bg-primary);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            max-width: 110px;
        }
        .demo-account-btn:hover {
            border-color: var(--accent);
            background: var(--accent-bg);
            transform: translateY(-2px);
        }
        .demo-role {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 2px;
        }
        .demo-name {
            display: block;
            font-size: 0.6875rem;
            color: var(--text-muted);
        }

        /* 教师入驻申请 */
        .apply-notice {
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--teal-bg);
            border-radius: 8px;
            border-left: 3px solid var(--teal);
        }
        .apply-notice p {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .apply-footer {
            margin-top: 20px;
            text-align: center;
        }
        .apply-footer p {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }
        .apply-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }
        .apply-footer a:hover {
            text-decoration: underline;
        }

        /* 忘记密码弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-box {
            background: var(--bg-secondary);
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            padding: 32px;
            transform: translateY(20px);
            transition: transform 0.3s;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-header h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .modal-close svg { width: 18px; height: 18px; }

        /* 步骤指示器 */
        .step-indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }
        .step-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }
        .step-indicator.active {
            background: var(--accent);
            width: 24px;
            border-radius: 4px;
        }

        /* 短信验证码 */
        .sms-row { display: flex; gap: 12px; }
        .sms-row .form-input { flex: 1; }
        .btn-sms {
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-sms:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-sms:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 入驻申请成功提示 */
        .apply-success {
            text-align: center;
            padding: 40px 20px;
        }
        .apply-success-icon {
            width: 64px;
            height: 64px;
            background: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .apply-success-icon svg { width: 32px; height: 32px; stroke: #fff; }
        .apply-success h3 {
            font-size: 1.25rem;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .apply-success p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Toast */
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 1000; }
        .toast {
            padding: 12px 18px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
            box-shadow: var(--shadow-md);
        }
        .toast.success { background: var(--success); color: #fff; border-color: var(--success); }
        .toast.error { background: var(--error); color: #fff; border-color: var(--error); }
        .toast.warning { background: var(--warning); color: #fff; border-color: var(--warning); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .hero { display: none; }
            .login-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 左侧装饰区 -->
        <div class="hero">
            <!-- 分子键线装饰 -->
            <svg class="molecule-decoration" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <pattern id="molecule-grid" width="60" height="60" patternUnits="userSpaceOnUse">
                        <line x1="0" y1="30" x2="30" y2="0" stroke="#B85C38" stroke-width="0.5" opacity="0.3"/>
                        <line x1="30" y1="0" x2="60" y2="30" stroke="#B85C38" stroke-width="0.5" opacity="0.3"/>
                        <circle cx="30" cy="30" r="4" fill="none" stroke="#B85C38" stroke-width="0.5" opacity="0.3"/>
                        <circle cx="0" cy="0" r="2" fill="#B85C38" opacity="0.2"/>
                        <circle cx="60" cy="0" r="2" fill="#B85C38" opacity="0.2"/>
                        <circle cx="0" cy="60" r="2" fill="#B85C38" opacity="0.2"/>
                        <circle cx="60" cy="60" r="2" fill="#B85C38" opacity="0.2"/>
                    </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#molecule-grid)"/>
                <!-- 中心分子结构 -->
                <g transform="translate(200, 280)">
                    <line x1="-80" y1="0" x2="-30" y2="0" stroke="#B85C38" stroke-width="2" opacity="0.6"/>
                    <circle cx="-30" cy="0" r="15" fill="none" stroke="#B85C38" stroke-width="2" opacity="0.6"/>
                    <line x1="-15" y1="0" x2="15" y2="0" stroke="#B85C38" stroke-width="2" opacity="0.6"/>
                    <line x1="30" y1="0" x2="60" y2="-30" stroke="#B85C38" stroke-width="2" opacity="0.6"/>
                    <line x1="30" y1="0" x2="60" y2="30" stroke="#B85C38" stroke-width="2" opacity="0.6"/>
                    <circle cx="75" cy="-35" r="10" fill="var(--accent-bg)" stroke="#B85C38" stroke-width="1.5" opacity="0.8"/>
                    <circle cx="75" cy="35" r="10" fill="var(--teal-bg)" stroke="#4A7C8C" stroke-width="1.5" opacity="0.8"/>
                </g>
            </svg>

            <div class="hero-content">
                <div class="brand">
                    <div class="brand-label">Chemistry AI Tutoring</div>
                    <h1 class="brand-title">CHEM<span>·</span>AI</h1>
                    <p class="brand-subtitle">高中化学智能辅助教学平台</p>
                </div>

                <!-- 分子分隔线 -->
                <svg class="molecule-divider" viewBox="0 0 360 40">
                    <line x1="0" y1="20" x2="120" y2="20"/>
                    <circle cx="140" cy="20" r="12"/>
                    <line x1="152" y1="20" x2="200" y2="20"/>
                    <line x1="200" y1="20" x2="230" y2="8"/>
                    <line x1="200" y1="20" x2="230" y2="32"/>
                    <circle cx="250" cy="20" r="8" class="accent-circle"/>
                    <line x1="258" y1="20" x2="360" y2="20"/>
                </svg>

                <div class="features">
                    <div class="feature">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </div>
                        <span>精准诊断</span>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                        </div>
                        <span>高效学习</span>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                        </div>
                        <span>智能出题</span>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">

    <script src="app.js"></script>
    <script>
        let currentRole = 'teacher';
        let currentVerify = 'A1B2';

        // API 基础路径和 apiRequest 函数已在 app.js 中定义

        // 快速登录凭证映射（角色 → 数据库真实账号）
        const QUICK_LOGIN_CREDENTIALS = {
            admin:    { username: 'admin', password: 'admin123', label: '系统管理员' },
            academic: { username: 'hai', password: 'hai123456', label: '学科组长' },
            teacher: { username: 'liu', password: '123456', label: '任课教师' },
            student: { username: '202610101', password: '123456', label: '学生' },
            parent:  { username: '13800138000', password: '123456', label: '家长' },
        };

        function switchLoginTab(el, tab) {
            document.querySelectorAll('.form-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(tab + '-panel').classList.add('active');
            refreshVerify();
        }

        function togglePassword() {
            const input = document.getElementById('password-input');
            const eye = document.getElementById('eye-icon');
            const eyeOff = document.getElementById('eye-off-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eye.style.display = 'none';
                eyeOff.style.display = 'block';
            } else {
                input.type = 'password';
                eye.style.display = 'block';
                eyeOff.style.display = 'none';
            }
        }

        function refreshVerify() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            currentVerify = code;
            document.querySelectorAll('.verify-img').forEach(el => el.textContent = code);
        }

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 快速体验登录（调用真实后端API）
        async function quickLoginAs(role) {
            const creds = QUICK_LOGIN_CREDENTIALS[role];
            if (!creds) {
                showToast('未知角色', 'error');
                return;
            }

            showToast('正在登录...', 'info');
            const usernameInput = document.getElementById('username-input');
            const passwordInput = document.getElementById('password-input');

            try {
                const result = await apiRequest('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username: creds.username, password: creds.password })
                });

                if (result.success) {
                    const userData = { ...result.user };
                    if (result.token) userData.token = result.token;
                    if (result.refresh_token) userData.refreshToken = result.refresh_token;
                    sessionStorage.setItem('chemai_user', JSON.stringify(userData));
                    showToast(`${creds.label} 登录成功`, 'success');
                    redirectByRole(result.user.role);
                } else {
                    showToast(result.message || '登录失败', 'error');
                }
            } catch (error) {
                console.error('快速登录失败:', error);
                showToast('无法连接到服务器，请检查服务是否启动', 'error');
            }
        }

        function redirectByRole(role) {
            const target = role === 'student' ? 'student_v2.html'
                : role === 'parent' ? 'parent_portal.html'
                : 'teacher_v2.html';
            setTimeout(() => { window.location.href = target; }, 800);
        }

        async function handleLogin() {
            const username = document.getElementById('username-input').value.trim();
            const password = document.getElementById('password-input').value;
            const verifyCode = document.getElementById('verify-input').value.trim().toUpperCase();

            if (!username) {
                showToast('请输入用户名或手机号', 'error');
                return;
            }
            if (!password) {
                showToast('请输入密码', 'error');
                return;
            }
            if (!verifyCode) {
                showToast('请输入验证码', 'error');
                return;
            }
            if (verifyCode !== currentVerify) {
                showToast('验证码错误', 'error');
                refreshVerify();
                return;
            }

            showToast('正在登录...', 'info');

            try {
                // 调用后端登录API
                const result = await apiRequest('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });

                if (result.success) {
                    // 保存用户信息和token（合并存储）
                    const userData = { ...result.user };
                    if (result.token) userData.token = result.token;
                    if (result.refresh_token) userData.refreshToken = result.refresh_token;
                    sessionStorage.setItem('chemai_user', JSON.stringify(userData));
                    showToast('登录成功，正在跳转...', 'success');
                    redirectByRole(result.user.role);
                } else {
                    showToast(result.message || '登录失败', 'error');
                }
            } catch (error) {
                console.error('登录失败:', error);
                handleLoginFallback(username, password);
            }
        }

        // Mock登录（API不可用时的后备，与数据库用户一致）
        function handleLoginFallback(username, password) {
            const mockUsers = {
                'admin': { name: '系统管理员', role: 'admin', school: '邵阳县第一中学', password: 'admin123' },
                'hai': { name: '海老师', role: '学科组长', school: '邵阳县第一中学', subject: '化学', password: 'hai123456' },
                'liu': { name: '刘老师', role: 'teacher', school: '邵阳县第一中学', subject: '化学', password: '123456' },
                'chen': { name: '陈老师', role: 'teacher', school: '邵阳县第一中学', subject: '数学', password: '123456' },
                '202610101': { name: '李雨萱', role: 'student', class: '高一(1)班', password: '123456' },
                '202610201': { name: '陈伟', role: 'student', class: '高一(2)班', password: '123456' },
                '13800138000': { name: '李国华', role: 'parent', student: '李雨萱', password: '123456' },
            };

            let user = mockUsers[username];

            if (!user || user.password !== password) {
                showToast('用户名或密码错误', 'error');
                return;
            }

            const { password: _, ...userWithoutPassword } = user;
            userWithoutPassword.username = username;
            sessionStorage.setItem('chemai_user', JSON.stringify(userWithoutPassword));
            showToast('登录成功（离线模式）', 'success');
            redirectByRole(user.role);
        }

        // 教师入驻申请
        async function handleApply() {
            const name = document.getElementById('apply-name').value.trim();
            const school = document.getElementById('apply-school').value.trim();
            const phone = document.getElementById('apply-phone').value.trim();
            const subject = document.getElementById('apply-subject').value;
            const verifyCode = document.getElementById('apply-verify').value.trim().toUpperCase();

            if (!name) { showToast('请输入姓名', 'error'); return; }
            if (!school) { showToast('请输入学校名称', 'error'); return; }
            if (!phone) { showToast('请输入手机号', 'error'); return; }
            if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('手机号格式不正确', 'error'); return; }
            if (!subject) { showToast('请选择任教科目', 'error'); return; }
            if (!verifyCode) { showToast('请输入验证码', 'error'); return; }
            if (verifyCode !== currentVerify) { showToast('验证码错误', 'error'); refreshVerify(); return; }

            showToast('正在提交申请...', 'info');

            try {
                const result = await apiRequest('/api/auth/apply', {
                    method: 'POST',
                    body: JSON.stringify({ name, school, phone, subject })
                });

                if (result.success) {
                    showToast('申请提交成功，请等待审核', 'success');
                    // 模拟成功
                    setTimeout(() => {
                        document.getElementById('forgot-step1').style.display = 'none';
                        document.getElementById('forgot-step2').style.display = 'none';
                        document.getElementById('forgot-step3').style.display = 'block';
                        document.getElementById('step-ind-1').classList.remove('active');
                        document.getElementById('step-ind-2').classList.remove('active');
                        document.getElementById('step-ind-3').classList.add('active');
                    }, 1000);
                } else {
                    showToast(result.message || '提交失败', 'error');
                }
            } catch (error) {
                // 模拟提交成功
                showToast('申请已提交，请等待管理员审核', 'success');
                setTimeout(() => {
                    switchLoginTab(document.querySelector('.form-tab'), 'login');
                }, 1500);
            }
        }

        // ========== 忘记密码弹窗 ==========
        let smsCountdown = 0;

        function showForgotPassword() {
            document.getElementById('forgot-modal').classList.add('active');
            resetForgotModal();
        }

        function closeForgotModal() {
            document.getElementById('forgot-modal').classList.remove('active');
        }

        function resetForgotModal() {
            document.getElementById('forgot-step1').style.display = 'block';
            document.getElementById('forgot-step2').style.display = 'none';
            document.getElementById('forgot-step3').style.display = 'none';
            document.getElementById('step-ind-1').classList.add('active');
            document.getElementById('step-ind-2').classList.remove('active');
            document.getElementById('step-ind-3').classList.remove('active');
            // 清空表单
            document.getElementById('forgot-phone').value = '';
            document.getElementById('forgot-verify').value = '';
            document.getElementById('forgot-sms').value = '';
            document.getElementById('forgot-new-pwd').value = '';
            document.getElementById('forgot-confirm-pwd').value = '';
            smsCountdown = 0;
            document.getElementById('btn-send-sms').textContent = '发送验证码';
            document.getElementById('btn-send-sms').disabled = false;
        }

        function forgotStep1() {
            const phone = document.getElementById('forgot-phone').value.trim();
            const verifyCode = document.getElementById('forgot-verify').value.trim().toUpperCase();

            if (!phone) { showToast('请输入手机号', 'error'); return; }
            if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('手机号格式不正确', 'error'); return; }
            if (!verifyCode) { showToast('请输入验证码', 'error'); return; }
            if (verifyCode !== currentVerify) { showToast('验证码错误', 'error'); refreshVerify(); return; }

            // 模拟验证手机号是否存在
            showToast('验证中...', 'info');
            setTimeout(() => {
                document.getElementById('forgot-step1').style.display = 'none';
                document.getElementById('forgot-step2').style.display = 'block';
                document.getElementById('step-ind-1').classList.remove('active');
                document.getElementById('step-ind-2').classList.add('active');
                showToast('手机号验证通过', 'success');
            }, 800);
        }

        async function sendSmsCode() {
            if (smsCountdown > 0) return;

            const phone = document.getElementById('forgot-phone').value.trim();
            if (!phone || !/^1[3-9]\d{9}$/.test(phone)) {
                showToast('请输入正确的手机号', 'error');
                return;
            }

            showToast('正在发送...', 'info');
            // 模拟发送
            await new Promise(resolve => setTimeout(resolve, 800));

            smsCountdown = 60;
            document.getElementById('btn-send-sms').disabled = true;
            updateSmsButton();

            showToast('验证码已发送', 'success');
        }

        function updateSmsButton() {
            const btn = document.getElementById('btn-send-sms');
            if (smsCountdown > 0) {
                btn.textContent = `${smsCountdown}秒后重发`;
                smsCountdown--;
                setTimeout(updateSmsButton, 1000);
            } else {
                btn.textContent = '发送验证码';
                btn.disabled = false;
            }
        }

        function forgotStep2() {
            const smsCode = document.getElementById('forgot-sms').value.trim();
            const newPwd = document.getElementById('forgot-new-pwd').value;
            const confirmPwd = document.getElementById('forgot-confirm-pwd').value;

            if (!smsCode) { showToast('请输入短信验证码', 'error'); return; }
            if (smsCode.length !== 6) { showToast('验证码应为6位', 'error'); return; }
            if (!newPwd) { showToast('请输入新密码', 'error'); return; }
            if (newPwd.length < 8) { showToast('密码至少8位', 'error'); return; }
            if (newPwd !== confirmPwd) { showToast('两次密码不一致', 'error'); return; }

            showToast('正在修改...', 'info');
            // 模拟修改
            setTimeout(() => {
                document.getElementById('forgot-step2').style.display = 'none';
                document.getElementById('forgot-step3').style.display = 'block';
                document.getElementById('step-ind-2').classList.remove('active');
                document.getElementById('step-ind-3').classList.add('active');
            }, 800);
        }

        // 点击弹窗外部关闭
        document.getElementById('forgot-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeForgotModal();
            }
        });

        // ESC键关闭弹窗
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeForgotModal();
            }
        });

        // 初始化验证码
        refreshVerify();
    </script>
</body>
</html>
