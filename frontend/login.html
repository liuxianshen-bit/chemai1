<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 智辅化学</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{primary:"#002045","on-primary":"#ffffff","primary-container":"#1a365d","secondary":"#13696a",surface:"#fbf9f5","surface-warm":"#F5EFE6","surface-container-low":"#f5f3ef","on-surface":"#1b1c1a","on-surface-variant":"#43474e","wood-accent":"#D7C4B1","outline-variant":"#c4c6cf",background:"#fbf9f5"},fontFamily:{sans:["IBM Plex Sans"],mono:["JetBrains Mono"],display:["Manrope"]}}}}</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL'0,'wght'400,'GRAD'0,'opsz'24}
body{font-family:'IBM Plex Sans',sans-serif}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#002045 0%,#1a365d 50%,#0d4f50 100%)">

<div class="w-full max-w-md">
  <!-- Logo -->
  <div class="text-center mb-8">
    <span class="material-symbols-outlined text-5xl mb-3" style="color:#86a0cd">science</span>
    <h1 class="text-4xl font-bold text-white" style="font-family:Manrope">智辅化学</h1>
    <p class="mt-2" style="color:#86a0cd;font-family:'JetBrains Mono',monospace;font-size:13px">智慧教育辅助系统</p>
  </div>

  <!-- Login Card -->
  <div class="rounded-2xl p-8 shadow-lg" style="background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border:1px solid rgba(215,196,177,.3)">
    <h2 class="text-2xl font-bold mb-6" style="font-family:Manrope;color:#002045">登录</h2>

    <form id="login-form">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" style="color:#43474e;font-family:'JetBrains Mono'">用户名</label>
        <input id="username" type="text" placeholder="手机号/用户名" required
          class="w-full px-4 py-3 rounded-lg border text-sm outline-none transition"
          style="border-color:rgba(215,196,177,.6);font-family:'IBM Plex Sans'"
          onfocus="this.style.borderColor='#002045';this.style.boxShadow='0 0 0 3px rgba(0,32,69,.1)'"
          onblur="this.style.borderColor='rgba(215,196,177,.6)';this.style.boxShadow='none'">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium mb-1" style="color:#43474e;font-family:'JetBrains Mono'">密码</label>
        <input id="password" type="password" placeholder="输入密码" required
          class="w-full px-4 py-3 rounded-lg border text-sm outline-none transition"
          style="border-color:rgba(215,196,177,.6);font-family:'IBM Plex Sans'"
          onfocus="this.style.borderColor='#002045';this.style.boxShadow='0 0 0 3px rgba(0,32,69,.1)'"
          onblur="this.style.borderColor='rgba(215,196,177,.6)';this.style.boxShadow='none'">
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium mb-1" style="color:#43474e;font-family:'JetBrains Mono'">角色</label>
        <select id="role"
          class="w-full px-4 py-3 rounded-lg border text-sm outline-none transition bg-white"
          style="border-color:rgba(215,196,177,.6);font-family:'IBM Plex Sans'"
          onfocus="this.style.borderColor='#002045';this.style.boxShadow='0 0 0 3px rgba(0,32,69,.1)'"
          onblur="this.style.borderColor='rgba(215,196,177,.6)';this.style.boxShadow='none'">
          <option value="teacher">教师</option>
          <option value="student">学生</option>
          <option value="parent">家长</option>
        </select>
      </div>

      <button type="submit"
        class="w-full py-3 rounded-lg text-white font-medium text-sm transition-all"
        style="background:#002045;font-family:'IBM Plex Sans'"
        onmouseover="this.style.background='#1a365d'"
        onmouseout="this.style.background='#002045'">
        登录
      </button>
    </form>

    <div id="login-msg" class="mt-4 text-center text-sm hidden"></div>

    <p class="mt-6 text-center text-xs" style="color:#74777f">
      测试账号: admin / admin123 &nbsp;|&nbsp; liu / 123456
    </p>
  </div>
</div>

<script>
// ─── 登录逻辑 ───
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault()
  var username = document.getElementById('username').value.trim()
  var password = document.getElementById('password').value
  var role = document.getElementById('role').value
  var msg = document.getElementById('login-msg')

  if (!username || !password) { showMsg('请输入用户名和密码', 'error'); return }

  try {
    showMsg('登录中...', 'info')
    var resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
    var data = await resp.json()

    if (data.success) {
      // 保存用户信息
      var userData = {
        id: data.user.id,
        username: data.user.username,
        name: data.user.name,
        role: data.user.role,
        school: data.user.school,
        token: data.token,
        refreshToken: data.refresh_token
      }
      sessionStorage.setItem('chemai_user', JSON.stringify(userData))
      showMsg('登录成功！', 'success')

      // role-based 重定向
      setTimeout(function() {
        var target = role === 'parent' ? '/parent_portal.html' : '/'
        window.location.href = target
      }, 500)
    } else {
      showMsg(data.message || '登录失败', 'error')
    }
  } catch (e) {
    showMsg('网络错误: ' + e.message, 'error')
  }
})

function showMsg(text, type) {
  var el = document.getElementById('login-msg')
  el.textContent = text; el.className = 'mt-4 text-center text-sm'
  el.classList.remove('hidden')
  if (type === 'error') el.style.color = '#C53030'
  else if (type === 'success') el.style.color = '#2F855A'
  else el.style.color = '#43474e'
}
</script>
</body>
</html>
