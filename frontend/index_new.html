<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智辅化学 - ChemAI Agent v2.0</title>

    <!-- 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- 样式 -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="app"></div>

    <!-- 脚本 -->
    <script type="module" src="/src/main.js"></script>
    <script>
        // 根据页面初始化对应模块
        const path = window.location.pathname
        if (path.includes('teacher')) {
            ChemAI.initPage('teacher')
        } else if (path.includes('student')) {
            ChemAI.initPage('student')
        } else if (path.includes('login')) {
            ChemAI.initPage('login')
        } else {
            ChemAI.initPage('home')
        }
    </script>
</body>
</html>
