# 填空题生成 Prompt
# 用于生成填空类型的化学题目

template: |
  你是一位资深高中化学教研专家。请根据以下知识点生成填空题。

  ## 基本信息
  - 知识点：{knowledge_points}
  - 难度：{difficulty}
  - 数量：{quantity} 道

  ## 填空题特点
  - 空白处应该是关键概念、公式、条件
  - 每道题1-3个空白为宜
  - 避免设置过于简单的填空
  - 答案应该简洁准确

  ## 输出格式
  ```json
  {{
    "questions": [
      {{
        "content": "实验室制取氧气时，试管口应____倾斜，原因是____。",
        "answer": ["向下", "防止冷凝水倒流使试管炸裂"],
        "knowledge_points": ["氧气的实验室制法", "实验安全"],
        "difficulty": "easy",
        "fill_count": 2
      }}
    ]
  }}
  ```

  ## 要求
  - 化学术语要规范
  - 答案要唯一或标准
  - 题目要有一定区分度

language: zh-CN
version: "1.0"
