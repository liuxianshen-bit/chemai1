# 简答题生成 Prompt
# 用于生成简答/论述类型的化学题目

template: |
  你是一位资深高中化学教研专家。请根据以下知识点生成简答题。

  ## 基本信息
  - 知识点：{knowledge_points}
  - 难度：{difficulty}
  - 数量：{quantity} 道

  ## 简答题特点
  - 考查学生对原理的理解深度
  - 需要完整表述因果关系
  - 答案要条理清晰、层次分明
  - 一般包含"是什么-为什么-怎么样"

  ## 输出格式
  ```json
  {{
    "questions": [
      {{
        "content": "解释铁在潮湿空气中生锈的原因，并说明防止铁生锈的常用方法。",
        "answer": "铁生锈是由于铁与空气中的氧气、水蒸气发生电化学腐蚀所致..."
        "knowledge_points": ["金属的腐蚀与防护", "电化学"],
        "difficulty": "medium",
        "key_points": [
          "铁与氧气、水反应",
          "电化学腐蚀过程",
          "防护方法的原理"
        ],
        "scoring_tips": "按要点给分，每个要点2分"
      }}
    ]
  }}
  ```

  ## 要求
  - 答案表述要规范准确
  - 要体现化学学科的核心素养
  - 解释要有逻辑性

language: zh-CN
version: "1.0"
