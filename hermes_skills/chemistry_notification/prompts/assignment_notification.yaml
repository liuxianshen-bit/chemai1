# 作业通知 Prompt

## 用途
生成作业布置通知内容。

## 输入
- class_name: 班级名称
- exam_name: 作业名称
- knowledge_points: 知识点列表
- question_count: 题目数量
- deadline: 截止时间

## Discord 格式
```json
{
  "title": "📝 新作业布置",
  "description": "班级 {class_name} 有新作业",
  "fields": [
    {"name": "作业名称", "value": "{exam_name}"},
    {"name": "知识点", "value": "{knowledge_points}"},
    {"name": "题目数量", "value": "{question_count}"},
    {"name": "截止时间", "value": "{deadline}"}
  ],
  "color": 5814783
}
```

## Telegram 格式
Markdown 格式简洁通知
