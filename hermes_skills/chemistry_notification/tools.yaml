tools:
  # ===== 作业通知 =====

  - name: notify_assignment
    description: 发送作业布置通知
    input_schema:
      type: object
      properties:
        class_id:
          type: string
          description: 班级ID
        class_name:
          type: string
          description: 班级名称
        exam_name:
          type: string
          description: 作业名称
        knowledge_points:
          type: array
          items:
            type: string
          description: 知识点列表
        question_count:
          type: integer
          description: 题目数量
        deadline:
          type: string
          description: 截止时间
        channel:
          type: string
          enum: [discord, slack, telegram, email, all]
          default: all
          description: 推送渠道
        practice_link:
          type: string
          description: 练习链接
      required: [class_id, class_name, exam_name, knowledge_points, question_count, deadline]

  # ===== 错题报告 =====

  - name: notify_error_report
    description: 发送错题报告通知
    input_schema:
      type: object
      properties:
        student_id:
          type: string
          description: 学生ID
        student_name:
          type: string
          description: 学生姓名
        exam_name:
          type: string
          description: 考试名称
        score:
          type: number
          description: 得分率
        class_avg:
          type: number
          description: 班级平均分
        weak_kps:
          type: array
          items:
            type: object
          description: 薄弱知识点 [{name, count}]
        channel:
          type: string
          enum: [discord, slack, telegram, email, all]
          default: telegram
        report_link:
          type: string
          description: 报告链接
        parent_telegram_id:
          type: string
          description: 家长Telegram ID
        parent_email:
          type: string
          description: 家长邮箱
      required: [student_id, student_name, exam_name, score, weak_kps]

  # ===== 学习计划 =====

  - name: notify_learning_plan
    description: 发送个性化学习计划通知
    input_schema:
      type: object
      properties:
        student_id:
          type: string
          description: 学生ID
        student_name:
          type: string
          description: 学生姓名
        barrier_type:
          type: string
          description: 障碍类型
        weak_kps:
          type: array
          items:
            type: string
          description: 薄弱知识点
        plan_period:
          type: string
          description: 计划周期
        daily_tasks:
          type: array
          items:
            type: string
          description: 每日任务
        channel:
          type: string
          enum: [telegram, email, all]
          default: telegram
        plan_link:
          type: string
          description: 计划链接
        student_telegram_id:
          type: string
        parent_telegram_id:
          type: string
        parent_email:
          type: string
      required: [student_id, student_name, barrier_type, weak_kps, plan_period, daily_tasks]

  # ===== 成绩预警 =====

  - name: notify_score_alert
    description: 发送成绩预警通知
    input_schema:
      type: object
      properties:
        student_id:
          type: string
          description: 学生ID
        student_name:
          type: string
          description: 学生姓名
        exam_name:
          type: string
          description: 考试名称
        score:
          type: number
          description: 得分率
        threshold:
          type: number
          description: 预警阈值
        channel:
          type: string
          enum: [telegram, email, all]
          default: email
        parent_email:
          type: string
        parent_telegram_id:
          type: string
      required: [student_id, student_name, exam_name, score, threshold]

  # ===== 班级通知 =====

  - name: notify_class
    description: 发送班级通知
    input_schema:
      type: object
      properties:
        class_id:
          type: string
          description: 班级ID
        class_name:
          type: string
          description: 班级名称
        message:
          type: string
          description: 通知内容
        channel:
          type: string
          enum: [discord, slack, all]
          default: discord
        urgent:
          type: boolean
          default: false
          description: 是否紧急
      required: [class_id, class_name, message]

  # ===== 日常鼓励 =====

  - name: notify_encouragement
    description: 发送日常鼓励消息
    input_schema:
      type: object
      properties:
        student_id:
          type: string
          description: 学生ID
        student_name:
          type: string
          description: 学生姓名
        message:
          type: string
          description: 鼓励内容
        channel:
          type: string
          enum: [telegram, discord]
          default: telegram
        telegram_id:
          type: string
      required: [student_id, student_name, message]

  # ===== 配置管理 =====

  - name: notify_config_get
    description: 获取通知渠道配置
    input_schema:
      type: object
      properties:
        teacher_id:
          type: string
          description: 教师ID
      required: [teacher_id]

  - name: notify_config_update
    description: 更新通知渠道配置
    input_schema:
      type: object
      properties:
        teacher_id:
          type: string
          description: 教师ID
        discord_webhook:
          type: string
          description: Discord Webhook URL
        slack_webhook:
          type: string
          description: Slack Webhook URL
        telegram_bot_token:
          type: string
          description: Telegram Bot Token
        email_smtp_host:
          type: string
          description: SMTP 服务器
        email_smtp_port:
          type: integer
          description: SMTP 端口
        email_username:
          type: string
          description: 邮箱用户名
        email_password:
          type: string
          description: 邮箱密码 (加密存储)
        email_from:
          type: string
          description: 发件人地址
      required: [teacher_id]
