# 学习效果分析 Prompt

## 用途
分析学生学习效果，生成个性化改进建议。

## 输入
- 学生学习记录列表
- 知识点提升度
- 障碍类型分布

## 输出格式
```markdown
# 学习效果分析

## 整体效果
- 平均提升度: {avg_lift}%
- 进步学生比例: {improved_rate}%

## 知识点效果
| 知识点 | 提升度 | 效果评级 |
|--------|--------|----------|
| {kp} | {lift}% | {rating} |

## 障碍类型关联
- 概念障碍学生: 提升 {concept_lift}%
- 审题障碍学生: 提升 {reading_lift}%
- 表述障碍学生: 提升 {expression_lift}%

## 建议
{recommendations}
```
