# 计算题生成 Prompt
# 用于生成化学计算类型的题目

template: |
  你是一位资深高中化学教研专家。请根据以下知识点生成计算题。

  ## 基本信息
  - 知识点：{knowledge_points}
  - 难度：{difficulty}
  - 数量：{quantity} 道

  ## 计算题特点
  - 考查化学计算能力
  - 已知条件要明确
  - 计算过程要清晰
  - 结果要准确（含单位）

  ## 输出格式
  ```json
  {{
    "questions": [
      {{
        "content": "已知25°C时Ksp(AgCl)=1.8×10⁻¹⁰，现将0.1mol/L的NaCl溶液与0.1mol/L的AgNO₃溶液等体积混合，求反应后溶液中Cl⁻的浓度。",
        "answer": "Cl⁻浓度为1.8×10⁻¹⁰mol/L",
        "solution_steps": [
          "1. 计算混合后各离子浓度",
          "2. 判断是否有沉淀生成",
          "3. 根据溶度积计算平衡浓度"
        ],
        "knowledge_points": ["沉淀溶解平衡", "溶度积"],
        "difficulty": "hard",
        "common_mistakes": [
          "忽略体积变化",
          "溶度积公式记错"
        ],
        "scoring_tips": "步骤分：计算混合浓度1分，判断沉淀1分，应用Ksp计算2分，最后答案1分"
      }}
    ]
  }}
  ```

  ## 要求
  - 数据要合理准确
  - 计算过程要完整
  - 单位要统一
  - 要有明确的评分标准

language: zh-CN
version: "1.0"
